<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bennie Choco — ประกาศ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#A0C4FF;
  --mint:#CAFFBF;
  --yellow:#FDFFB6;
  --cream:#fffdf5;
  --white:#ffffff;
  --text:#3D405B;
  --muted:#7b8098;
  --line:rgba(61,64,91,.10);
  --shadow:0 16px 45px rgba(61,64,91,.10);
  --shadow-soft:0 8px 25px rgba(61,64,91,.08);
  --radius:24px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Prompt",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 8%,rgba(160,196,255,.55),transparent 27%),
    radial-gradient(circle at 90% 18%,rgba(202,255,191,.58),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(253,255,182,.42),transparent 35%),
    linear-gradient(180deg,#fafdff 0%,#fffef7 100%);
  overflow-x:hidden;
}

/* =========================
   BACKGROUND CLOUDS
========================= */

.cloud{
  position:fixed;
  z-index:0;
  pointer-events:none;
  opacity:.55;
  filter:blur(.2px);
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.92);
}

.cloud.one{
  width:180px;
  height:55px;
  top:90px;
  left:-55px;
  border-radius:50px;
  background:rgba(255,255,255,.92);
}

.cloud.one::before{
  width:75px;
  height:75px;
  left:35px;
  bottom:10px;
}

.cloud.one::after{
  width:55px;
  height:55px;
  left:95px;
  bottom:7px;
}

.cloud.two{
  width:210px;
  height:58px;
  top:42%;
  right:-90px;
  border-radius:50px;
  background:rgba(255,255,255,.8);
}

.cloud.two::before{
  width:82px;
  height:82px;
  left:38px;
  bottom:9px;
}

.cloud.two::after{
  width:60px;
  height:60px;
  left:110px;
  bottom:6px;
}

.cloud.three{
  width:190px;
  height:52px;
  bottom:70px;
  left:-65px;
  border-radius:50px;
  background:rgba(255,255,255,.82);
}

.cloud.three::before{
  width:68px;
  height:68px;
  left:42px;
  bottom:8px;
}

.cloud.three::after{
  width:54px;
  height:54px;
  left:100px;
  bottom:6px;
}

/* =========================
   PAGE
========================= */

.page{
  position:relative;
  z-index:2;
  width:min(100%,760px);
  margin:0 auto;
  padding:18px 16px 45px;
}

/* =========================
   HEADER
========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.back-btn,
.refresh-btn{
  border:0;
  background:rgba(255,255,255,.88);
  color:var(--text);
  min-height:46px;
  padding:0 15px;
  border-radius:16px;
  font-family:inherit;
  font-size:14px;
  font-weight:500;
  box-shadow:var(--shadow-soft);
  cursor:pointer;
  transition:.2s ease;
  border:1px solid rgba(255,255,255,.8);
}

.back-btn:hover,
.refresh-btn:hover{
  transform:translateY(-1px);
}

.back-btn:active,
.refresh-btn:active{
  transform:scale(.97);
}

.refresh-btn:disabled{
  opacity:.6;
  cursor:wait;
  transform:none;
}

.brand-mini{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.brand-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#fff,#eef6ff);
  box-shadow:var(--shadow-soft);
  font-size:20px;
}

.brand-text{
  min-width:0;
}

.brand-name{
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
}

.brand-sub{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  overflow:hidden;
  padding:27px 23px 25px;
  border-radius:30px;
  background:
    linear-gradient(135deg,
      rgba(255,255,255,.95),
      rgba(240,248,255,.92));
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.hero::after{
  content:"";
  position:absolute;
  width:145px;
  height:145px;
  right:-55px;
  top:-55px;
  border-radius:50%;
  background:rgba(202,255,191,.45);
}

.hero::before{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  right:48px;
  bottom:-58px;
  border-radius:50%;
  background:rgba(253,255,182,.55);
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero-kicker{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(160,196,255,.20);
  color:#5578b7;
  font-size:12px;
  font-weight:500;
  margin-bottom:10px;
}

.hero h1{
  margin:0;
  font-size:clamp(25px,7vw,35px);
  line-height:1.2;
  letter-spacing:-.4px;
}

.hero p{
  margin:9px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

/* =========================
   USER INFO
========================= */

.user-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 16px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.9);
  border-radius:20px;
  box-shadow:var(--shadow-soft);
  margin-bottom:15px;
}

.user-left{
  min-width:0;
}

.user-label{
  font-size:10px;
  color:var(--muted);
  margin-bottom:2px;
}

.user-name{
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-code{
  font-size:11px;
  color:#6f86a9;
}

.status-pill{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(202,255,191,.48);
  color:#47744a;
  font-size:11px;
  font-weight:500;
}

/* =========================
   FILTERS
========================= */

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  min-width:0;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter-btn{
  flex:0 0 auto;
  border:1px solid rgba(61,64,91,.07);
  background:rgba(255,255,255,.78);
  color:var(--muted);
  padding:9px 14px;
  border-radius:999px;
  font-family:inherit;
  font-size:12px;
  cursor:pointer;
  transition:.2s ease;
}

.filter-btn.active{
  color:var(--text);
  background:linear-gradient(135deg,var(--blue),#d9e8ff);
  border-color:transparent;
  box-shadow:0 6px 18px rgba(160,196,255,.3);
  font-weight:500;
}

.toolbar-refresh{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.88);
  color:var(--text);
  font-size:17px;
  cursor:pointer;
  box-shadow:var(--shadow-soft);
}

/* =========================
   LIST
========================= */

.announcement-list{
  display:grid;
  gap:13px;
}

.announcement-card{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.91);
  border:1px solid rgba(255,255,255,.9);
  border-radius:23px;
  box-shadow:var(--shadow-soft);
  cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}

.announcement-card:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 34px rgba(61,64,91,.11);
}

.announcement-card:active{
  transform:scale(.99);
}

.card-image{
  width:100%;
  aspect-ratio:16/8;
  object-fit:cover;
  display:block;
  background:#eef5ff;
}

.card-body{
  padding:16px 17px 17px;
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.card-title{
  margin:0;
  font-size:16px;
  line-height:1.45;
  font-weight:600;
}

.badges{
  display:flex;
  align-items:center;
  gap:5px;
  flex:0 0 auto;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:5px 8px;
  border-radius:999px;
  font-size:9px;
  line-height:1;
  font-weight:500;
  white-space:nowrap;
}

.badge-pinned{
  background:rgba(253,255,182,.75);
  color:#857b2e;
}

.badge-new{
  background:rgba(202,255,191,.65);
  color:#4d7852;
}

.card-date{
  margin-top:6px;
  color:#9a9daf;
  font-size:10px;
}

.card-preview{
  margin:11px 0 0;
  color:#6e7286;
  font-size:12px;
  line-height:1.7;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.read-more{
  margin-top:12px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:#6688bd;
  font-size:11px;
  font-weight:500;
}

/* =========================
   EMPTY / ERROR
========================= */

.state-box{
  padding:38px 22px;
  text-align:center;
  border-radius:24px;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow-soft);
}

.state-icon{
  font-size:36px;
  margin-bottom:8px;
}

.state-title{
  font-size:15px;
  font-weight:600;
}

.state-text{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.retry-btn{
  margin-top:15px;
  border:0;
  padding:10px 16px;
  border-radius:14px;
  background:var(--blue);
  color:var(--text);
  font-family:inherit;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
}

/* =========================
   LOADING
========================= */

.loading-wrap{
  display:grid;
  gap:12px;
}

.skeleton{
  height:155px;
  border-radius:23px;
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.65) 25%,
      rgba(255,255,255,.95) 50%,
      rgba(255,255,255,.65) 75%
    );
  background-size:200% 100%;
  animation:loading 1.3s infinite;
}

@keyframes loading{
  from{background-position:200% 0}
  to{background-position:-200% 0}
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(61,64,91,.32);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  padding:12px;
}

.modal.show{
  display:flex;
}

.modal-panel{
  width:min(100%,720px);
  max-height:92vh;
  overflow:hidden;
  border-radius:29px 29px 22px 22px;
  background:#fffefa;
  box-shadow:0 25px 80px rgba(61,64,91,.22);
  animation:modalIn .22s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(18px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.modal-scroll{
  max-height:92vh;
  overflow-y:auto;
  overscroll-behavior:contain;
}

.modal-image{
  width:100%;
  max-height:320px;
  object-fit:cover;
  display:none;
}

.modal-content{
  padding:22px 20px 25px;
}

.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.modal-title{
  margin:0;
  font-size:20px;
  line-height:1.45;
  font-weight:600;
}

.close-btn{
  flex:0 0 auto;
  width:39px;
  height:39px;
  border:0;
  border-radius:13px;
  background:#f2f5fa;
  color:var(--text);
  font-size:18px;
  cursor:pointer;
}

.modal-meta{
  margin-top:8px;
  color:#969aaa;
  font-size:10px;
}

.modal-text{
  margin-top:18px;
  color:#555a70;
  font-size:13px;
  line-height:1.9;
  white-space:pre-wrap;
  word-break:break-word;
}

.modal-badges{
  margin-top:10px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

/* =========================
   FOOTER
========================= */

.footer{
  padding:25px 8px 5px;
  text-align:center;
  color:#9b9eb0;
  font-size:10px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  z-index:300;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:10px 15px;
  border-radius:14px;
  background:rgba(61,64,91,.92);
  color:white;
  font-size:11px;
  transition:.22s ease;
  max-width:calc(100% - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:480px){

  .page{
    padding:13px 12px 35px;
  }

  .topbar{
    margin-bottom:13px;
  }

  .brand-name{
    font-size:13px;
  }

  .brand-sub{
    font-size:9px;
  }

  .brand-icon{
    width:38px;
    height:38px;
    flex-basis:38px;
  }

  .back-btn{
    padding:0 12px;
    min-height:42px;
    font-size:12px;
  }

  .hero{
    padding:23px 19px;
    border-radius:25px;
  }

  .hero h1{
    font-size:25px;
  }

  .hero p{
    font-size:12px;
  }

  .user-card{
    padding:12px 13px;
  }

  .status-pill{
    padding:6px 8px;
    font-size:10px;
  }

  .card-body{
    padding:14px;
  }

  .card-title{
    font-size:15px;
  }

  .modal{
    padding:0;
  }

  .modal-panel{
    width:100%;
    max-height:94vh;
    border-radius:27px 27px 0 0;
  }

  .modal-scroll{
    max-height:94vh;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

/* =========================================================

/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentProfile = null;
let announcements = [];
let currentFilter = "all";
let loadingAnnouncements = false;
let toastTimer = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatDate(dateValue){

  if(!dateValue){
    return "";
  }

  const date = new Date(dateValue);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return new Intl.DateTimeFormat(
    "th-TH",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  ).format(date);
}


function isNewAnnouncement(dateValue){

  if(!dateValue){
    return false;
  }

  const created =
    new Date(dateValue).getTime();

  if(Number.isNaN(created)){
    return false;
  }

  const now = Date.now();

  const sevenDays =
    7 * 24 * 60 * 60 * 1000;

  return now - created <= sevenDays;
}


function showToast(message){

  clearTimeout(toastTimer);

  toast.textContent = message;
  toast.classList.add("show");

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  },2600);
}


function showErrorState(message){

  announcementList.innerHTML = `
    <div class="state-box">

      <div class="state-icon">☁️</div>

      <div class="state-title">
        ไม่สามารถโหลดประกาศได้
      </div>

      <div class="state-text">
        ${escapeHtml(message)}
      </div>

      <button
        type="button"
        class="retry-btn"
        id="retryBtn">
        ลองใหม่
      </button>

    </div>
  `;

  const retryBtn =
    document.getElementById("retryBtn");

  if(retryBtn){
    retryBtn.addEventListener(
      "click",
      loadAnnouncements
    );
  }
}


function showEmptyState(){

  announcementList.innerHTML = `
    <div class="state-box">

      <div class="state-icon">📢</div>

      <div class="state-title">
        ยังไม่มีประกาศ
      </div>

      <div class="state-text">
        ตอนนี้ยังไม่มีประกาศที่เผยแพร่
      </div>

    </div>
  `;
}


/* =========================================================
   SESSION
========================================================= */

/*
  จุดสำคัญ:
  ไม่ใช้ history.back()
  และไม่ redirect ทันทีจาก getUser()
  ก่อนที่ Supabase จะ restore session
*/

async function getValidSession(){

  try{

    const {
      data:{
        session
      },
      error
    } =
      await supabaseClient.auth.getSession();

    if(error){
      console.error(
        "getSession error:",
        error
      );
    }

    if(session){
      return session;
    }

  }catch(error){

    console.error(
      "session check error:",
      error
    );

  }

  /*
    เผื่อกรณี session กำลังถูก restore
    รอ event INITIAL_SESSION / SIGNED_IN
    แต่ไม่รอนานเกินไป
  */

  return await new Promise(resolve => {

    let finished = false;

    const finish = session => {

      if(finished){
        return;
      }

      finished = true;

      clearTimeout(timeout);

      try{
        subscription.unsubscribe();
      }catch(_){}

      resolve(session || null);
    };


    const timeout =
      setTimeout(() => {
        finish(null);
      },1500);


    const {
      data:{
        subscription
      }
    } =
      supabaseClient.auth.onAuthStateChange(
        (event, session) => {

          if(
            event === "SIGNED_IN" ||
            event === "INITIAL_SESSION" ||
            event === "TOKEN_REFRESHED"
          ){

            if(session){
              finish(session);
            }

          }

        }
      );

  });

}


/* =========================================================
   LOAD USER
========================================================= */

async function loadUser(){

  const session =
    await getValidSession();

  if(!session || !session.user){

    window.location.replace("login.html");

    return false;
  }

  currentUser =
    session.user;


  const {
    data:profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        nickname,
        distributor_code,
        status,
        email
      `)
      .eq("id",currentUser.id)
      .maybeSingle();


  if(error){

    console.error(
      "profile error:",
      error
    );

    await supabaseClient.auth.signOut();

    window.location.replace("login.html");

    return false;
  }


  if(!profile){

    await supabaseClient.auth.signOut();

    window.location.replace("login.html");

    return false;
  }


  if(profile.status !== "active"){

    await supabaseClient.auth.signOut();

    window.location.replace("login.html");

    return false;
  }


  currentProfile =
    profile;


  userName.textContent =
    profile.nickname ||
    "ตัวแทนจำหน่าย";


  userCode.textContent =
    profile.distributor_code
      ? `รหัสตัวแทน: ${profile.distributor_code}`
      : "";


  return true;
}


/* =========================================================
   LOAD ANNOUNCEMENTS
========================================================= */

async function loadAnnouncements(){

  if(loadingAnnouncements){
    return;
  }

  loadingAnnouncements = true;

  refreshBtn.disabled = true;
  refreshBtn.textContent = "…";


  /*
    แสดง skeleton เฉพาะกรณียังไม่มีข้อมูล
    เพื่อไม่ให้หน้ากระพริบทุกครั้งที่ refresh
  */

  if(!announcements.length){

    announcementList.innerHTML = `
      <div class="loading-wrap">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    `;

  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("announcements")
        .select(`
          id,
          title,
          content,
          image_url,
          status,
          pinned,
          created_at,
          updated_at
        `)
        .eq("status","published")
        .order("pinned",{ascending:false})
        .order("created_at",{ascending:false});


    if(error){
      throw error;
    }


    announcements =
      Array.isArray(data)
        ? data
        : [];


    renderAnnouncements();


  }catch(error){

    console.error(
      "announcements error:",
      error
    );


    if(!announcements.length){

      showErrorState(
        "กรุณาลองใหม่อีกครั้ง"
      );

    }else{

      showToast(
        "รีเฟรชประกาศไม่สำเร็จ"
      );

    }

  }finally{

    loadingAnnouncements = false;

    refreshBtn.disabled = false;
    refreshBtn.textContent = "↻";

  }

}


/* =========================================================
   FILTER
========================================================= */

function getFilteredAnnouncements(){

  if(currentFilter === "pinned"){

    return announcements.filter(
      item => item.pinned === true
    );

  }

  return announcements;
}


function renderAnnouncements(){

  const items =
    getFilteredAnnouncements();


  if(!items.length){

    showEmptyState();

    return;
  }


  announcementList.innerHTML =
    items.map(item => {

      const title =
        escapeHtml(item.title || "ไม่มีหัวข้อ");


      const content =
        String(item.content || "")
          .replace(/\s+/g," ")
          .trim();


      const preview =
        escapeHtml(content);


      const image =
        item.image_url
          ? `
            <img
              class="card-image"
              src="${escapeHtml(item.image_url)}"
              alt="${title}"
              loading="lazy"
              onerror="this.style.display='none'">
          `
          : "";


      const pinnedBadge =
        item.pinned === true
          ? `
            <span class="badge badge-pinned">
              📌 ปักหมุด
            </span>
          `
          : "";


      const newBadge =
        isNewAnnouncement(item.created_at)
          ? `
            <span class="badge badge-new">
              ✦ ใหม่
            </span>
          `
          : "";


      return `
        <article
          class="announcement-card"
          data-id="${escapeHtml(item.id)}"
          tabindex="0"
          role="button"
          aria-label="อ่านประกาศ ${title}">

          ${image}

          <div class="card-body">

            <div class="card-top">

              <h2 class="card-title">
                ${title}
              </h2>

              <div class="badges">
                ${pinnedBadge}
                ${newBadge}
              </div>

            </div>

            <div class="card-date">
              ${escapeHtml(formatDate(item.created_at))}
            </div>

            ${
              preview
                ? `
                  <p class="card-preview">
                    ${preview}
                  </p>
                `
                : ""
            }

            <div class="read-more">
              อ่านรายละเอียด →
            </div>

          </div>

        </article>
      `;

    }).join("");


  document
    .querySelectorAll(".announcement-card")
    .forEach(card => {

      const id =
        card.dataset.id;


      card.addEventListener(
        "click",
        () => openAnnouncement(id)
      );


      card.addEventListener(
        "keydown",
        event => {

          if(
            event.key === "Enter" ||
            event.key === " "
          ){

            event.preventDefault();

            openAnnouncement(id);

          }

        }
      );

    });

}


/* =========================================================
   OPEN ANNOUNCEMENT
========================================================= */

function openAnnouncement(id){

  const item =
    announcements.find(
      announcement =>
        String(announcement.id) === String(id)
    );


  if(!item){
    return;
  }


  modalTitle.textContent =
    item.title || "ประกาศ";


  modalContent.textContent =
    item.content || "ไม่มีรายละเอียด";


  modalDate.textContent =
    formatDate(item.created_at);


  modalBadges.innerHTML = "";


  if(item.pinned === true){

    modalBadges.innerHTML += `
      <span class="badge badge-pinned">
        📌 ปักหมุด
      </span>
    `;

  }


  if(isNewAnnouncement(item.created_at)){

    modalBadges.innerHTML += `
      <span class="badge badge-new">
        ✦ ใหม่
      </span>
    `;

  }


  if(item.image_url){

    modalImage.src =
      item.image_url;

    modalImage.alt =
      item.title || "รูปประกาศ";

    modalImage.style.display =
      "block";

  }else{

    modalImage.removeAttribute("src");
    modalImage.style.display =
      "none";

  }


  detailModal.classList.add("show");

  document.body.style.overflow =
    "hidden";

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeAnnouncement(){

  detailModal.classList.remove("show");

  document.body.style.overflow =
    "";

}


/* =========================================================
   FILTER BUTTONS
========================================================= */

filterButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      currentFilter =
        button.dataset.filter || "all";


      filterButtons.forEach(
        item => {
          item.classList.toggle(
            "active",
            item === button
          );
        }
      );


      renderAnnouncements();

    }
  );

});


/* =========================================================
   BACK TO DASHBOARD
========================================================= */

/*
  ไม่ใช้ history.back()
  เพราะ browser history อาจมีหน้าอื่นคั่นอยู่

  หน้านี้ถูกออกแบบให้กลับ Dashboard โดยตรง
*/

backBtn.addEventListener(
  "click",
  () => {

    if(backBtn.disabled){
      return;
    }

    backBtn.disabled = true;
    backBtn.textContent = "กำลังกลับ...";

    window.location.replace(
      "dashboard.html"
    );

  }
);


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
  "click",
  loadAnnouncements
);


/* =========================================================
   MODAL EVENTS
========================================================= */

closeModalBtn.addEventListener(
  "click",
  closeAnnouncement
);


detailModal.addEventListener(
  "click",
  event => {

    if(event.target === detailModal){

      closeAnnouncement();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      detailModal.classList.contains("show")
    ){

      closeAnnouncement();

    }

  }
);


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    /*
      ถ้า session หายระหว่างใช้งาน
      ส่งกลับหน้า Login

      ไม่ทำอะไรกับ INITIAL_SESSION
      ถ้ามี session อยู่แล้ว
    */

    if(
      event === "SIGNED_OUT" &&
      currentUser
    ){

      currentUser = null;
      currentProfile = null;

      window.location.replace(
        "login.html"
      );

    }

  }
);


/* =========================================================
   INIT
========================================================= */

async function init(){

  const valid =
    await loadUser();


  if(!valid){
    return;
  }


  await loadAnnouncements();

}


init();

</script>
