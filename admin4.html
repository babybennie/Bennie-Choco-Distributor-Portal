<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bennie Choco Admin — Announcements</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Niramit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#A0C4FF;
  --blue-dark:#6f9fe8;
  --mint:#CAFFBF;
  --yellow:#FDFFB6;
  --cream:#fffdf7;
  --white:#ffffff;
  --text:#3D405B;
  --muted:#7d8298;
  --line:#e8edf7;
  --danger:#ef767a;
  --shadow:0 18px 45px rgba(82,105,150,.13);
  --radius:24px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:"Niramit",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,rgba(255,255,255,.95) 0 70px,transparent 71px),
    radial-gradient(circle at 90% 15%,rgba(255,255,255,.8) 0 90px,transparent 91px),
    linear-gradient(145deg,#eef6ff 0%,#f8fff7 48%,#fffdf0 100%);
  min-height:100vh;
  overflow-x:hidden;
}

/* CLOUDS */
.cloud{
  position:fixed;
  pointer-events:none;
  z-index:0;
  opacity:.72;
  filter:blur(.2px);
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.9);
  border-radius:999px;
}

.cloud.one{
  width:180px;
  height:60px;
  top:80px;
  left:-40px;
}

.cloud.one::before{
  width:75px;
  height:75px;
  left:25px;
  bottom:10px;
}

.cloud.one::after{
  width:100px;
  height:90px;
  left:80px;
  bottom:5px;
}

.cloud.two{
  width:220px;
  height:70px;
  top:420px;
  right:-70px;
}

.cloud.two::before{
  width:90px;
  height:90px;
  left:30px;
  bottom:10px;
}

.cloud.two::after{
  width:115px;
  height:100px;
  left:95px;
  bottom:0;
}

.cloud.three{
  width:160px;
  height:55px;
  bottom:70px;
  left:-30px;
}

.cloud.three::before{
  width:70px;
  height:70px;
  left:20px;
  bottom:5px;
}

.cloud.three::after{
  width:90px;
  height:80px;
  left:75px;
  bottom:0;
}

/* FLOATING DECOR */
.float-img{
  position:fixed;
  width:72px;
  height:72px;
  object-fit:contain;
  pointer-events:none;
  z-index:1;
  opacity:.9;
  animation:floaty 5s ease-in-out infinite;
}

.float-a{
  top:135px;
  right:4%;
}

.float-b{
  bottom:120px;
  right:6%;
  animation-delay:1.5s;
}

@keyframes floaty{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-12px) rotate(3deg)}
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:20;
  padding:16px 20px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(160,196,255,.22);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-icon{
  width:48px;
  height:48px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--mint));
  font-size:25px;
  box-shadow:0 8px 20px rgba(111,159,232,.18);
}

.brand h1{
  margin:0;
  font-size:20px;
  font-weight:700;
}

.brand p{
  margin:2px 0 0;
  font-size:12px;
  color:var(--muted);
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-btn{
  border:0;
  background:#fff;
  color:var(--text);
  text-decoration:none;
  border-radius:14px;
  padding:10px 14px;
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(61,64,91,.08);
  transition:.2s;
}

.header-btn:hover{
  transform:translateY(-2px);
}

.header-btn.primary{
  background:var(--blue);
}

/* MAIN */
main{
  position:relative;
  z-index:2;
  max-width:1200px;
  margin:auto;
  padding:35px 20px 70px;
}

.page-title{
  margin-bottom:24px;
}

.page-title h2{
  margin:0;
  font-size:30px;
  font-weight:700;
}

.page-title p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:14px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.8);
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow);
}

.stat-icon{
  font-size:22px;
}

.stat-number{
  margin-top:5px;
  font-size:27px;
  font-weight:700;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

/* TOOLBAR */
.toolbar{
  background:rgba(255,255,255,.9);
  border-radius:22px;
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:22px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:220px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  background:#fbfdff;
  color:var(--text);
  border-radius:14px;
  padding:12px 14px;
  font-family:inherit;
  font-size:14px;
  outline:none;
  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(160,196,255,.2);
}

textarea{
  min-height:150px;
  resize:vertical;
}

.toolbar select{
  width:180px;
}

.add-btn{
  border:0;
  border-radius:14px;
  padding:11px 18px;
  background:var(--blue);
  color:var(--text);
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
}

/* CARDS */
.announcement-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.announcement-card{
  background:rgba(255,255,255,.92);
  border-radius:24px;
  overflow:hidden;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.8);
}

.announcement-image{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
  background:#f3f6fb;
}

.announcement-body{
  padding:20px;
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.card-title{
  margin:0;
  font-size:19px;
  font-weight:700;
  line-height:1.4;
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.badge.published{
  background:#e8ffe2;
  color:#4c8242;
}

.badge.hidden{
  background:#f1f2f6;
  color:#74788a;
}

.badge.draft{
  background:#fff5c7;
  color:#8b7628;
}

.badge.pinned{
  background:#e9e5ff;
  color:#6855a8;
}

.card-content{
  margin:13px 0;
  color:#62677e;
  font-size:14px;
  line-height:1.7;
  white-space:pre-line;
  display:-webkit-box;
  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-date{
  color:#9297aa;
  font-size:11px;
  margin-bottom:14px;
}

.card-actions{
  display:flex;
  gap:8px;
}

.card-btn{
  flex:1;
  border:0;
  border-radius:13px;
  padding:10px;
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.edit-btn{
  background:#edf4ff;
  color:#5278b6;
}

.pin-btn{
  background:#fff8d9;
  color:#8b7628;
}

.delete-btn{
  background:#fff0f0;
  color:#bd6267;
}

/* EMPTY */
.empty{
  grid-column:1/-1;
  background:rgba(255,255,255,.9);
  border-radius:24px;
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
  box-shadow:var(--shadow);
}

.empty-icon{
  font-size:45px;
  margin-bottom:10px;
}

/* LOADING */
.loading{
  grid-column:1/-1;
  text-align:center;
  padding:50px;
  color:var(--muted);
}

/* MODAL */
.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(39,47,67,.42);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(680px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:28px;
  box-shadow:0 30px 80px rgba(36,50,80,.25);
}

.modal-header{
  padding:20px 22px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-header h3{
  margin:0;
  font-size:21px;
}

.close-btn{
  border:0;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#f3f5f9;
  color:var(--text);
  cursor:pointer;
  font-size:18px;
}

.modal-body{
  padding:22px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.check-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:4px 0 0;
}

.check-row input{
  width:18px;
  height:18px;
  accent-color:#8bb6f4;
}

.image-preview{
  margin-top:10px;
  display:none;
  border-radius:16px;
  overflow:hidden;
  background:#f5f7fb;
}

.image-preview img{
  width:100%;
  max-height:220px;
  object-fit:cover;
}

.modal-footer{
  padding:16px 22px 22px;
  display:flex;
  gap:10px;
}

.modal-footer button{
  flex:1;
  border:0;
  border-radius:14px;
  padding:12px;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
}

.cancel-btn{
  background:#f1f3f7;
  color:var(--text);
}

.save-btn{
  background:var(--blue);
  color:var(--text);
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  z-index:200;
  background:#3D405B;
  color:#fff;
  border-radius:14px;
  padding:12px 18px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  box-shadow:0 15px 35px rgba(0,0,0,.18);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.toast.success{
  background:#5f9560;
}

.toast.error{
  background:#c9686d;
}

/* RESPONSIVE */
@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .announcement-list{
    grid-template-columns:1fr;
  }

  .float-img{
    width:55px;
    height:55px;
  }
}

@media(max-width:560px){
  header{
    padding:12px;
  }

  .header-inner{
    align-items:flex-start;
  }

  .brand h1{
    font-size:17px;
  }

  .brand p{
    font-size:10px;
  }

  .brand-icon{
    width:42px;
    height:42px;
    border-radius:14px;
    font-size:21px;
  }

  .header-actions{
    flex-direction:column;
  }

  .header-btn{
    padding:8px 10px;
    font-size:11px;
  }

  main{
    padding:25px 12px 60px;
  }

  .page-title h2{
    font-size:25px;
  }

  .stats{
    gap:9px;
  }

  .stat{
    padding:14px;
  }

  .stat-number{
    font-size:23px;
  }

  .toolbar{
    padding:12px;
  }

  .search{
    min-width:100%;
  }

  .toolbar select,
  .add-btn{
    width:100%;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .modal{
    border-radius:22px;
  }

  .modal-body{
    padding:17px;
  }

  .announcement-image{
    height:165px;
  }

  .card-top{
    flex-direction:column;
  }

  .badges{
    justify-content:flex-start;
  }
}
</style>
</head>

>

<header>

<script>
const SUPABASE_URL =
  "https://arhvdvaugcjzkdbxesma.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Ctpm1h1NQKTdOPpY9yQ2qw_7kQg_57Z";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

let announcements = [];
let editingId = null;

/* =========================
   INIT
========================= */

document.addEventListener("DOMContentLoaded", async () => {
  await checkAdmin();
});

/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

  try{

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if(!session){
      window.location.href =
        "admin-login.html";
      return;
    }

    const {
      data,
      error
    } = await supabaseClient.rpc("is_admin");

    if(error || data !== true){

      await supabaseClient.auth.signOut();

      window.location.href =
        "admin-login.html";

      return;
    }

    await loadAnnouncements();

  }catch(error){

    console.error(error);

    window.location.href =
      "admin-login.html";
  }
}

/* =========================
   LOAD
========================= */

async function loadAnnouncements(){

  const list =
    document.getElementById(
      "announcementList"
    );

  list.innerHTML = `
    <div class="loading">
      ☁ กำลังโหลดประกาศ...
    </div>
  `;

  const {
    data,
    error
  } = await supabaseClient
    .from("announcements")
    .select("*")
    .order("pinned", {
      ascending:false
    })
    .order("created_at", {
      ascending:false
    });

  if(error){

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div>โหลดประกาศไม่สำเร็จ</div>
        <small>${escapeHtml(error.message)}</small>
      </div>
    `;

    return;
  }

  announcements = data || [];

  updateStats();
  renderAnnouncements();
}

/* =========================
   STATS
========================= */

function updateStats(){

  const all =
    announcements.length;

  const published =
    announcements.filter(
      a => a.status === "published"
    ).length;

  const pinned =
    announcements.filter(
      a => a.pinned === true
    ).length;

  const hidden =
    announcements.filter(
      a => a.status === "hidden"
    ).length;

  document.getElementById(
    "statAll"
  ).textContent = all;

  document.getElementById(
    "statPublished"
  ).textContent = published;

  document.getElementById(
    "statPinned"
  ).textContent = pinned;

  document.getElementById(
    "statHidden"
  ).textContent = hidden;
}

/* =========================
   RENDER
========================= */

function renderAnnouncements(){

  const list =
    document.getElementById(
      "announcementList"
    );

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();

  const status =
    document.getElementById(
      "statusFilter"
    ).value;

  const pin =
    document.getElementById(
      "pinFilter"
    ).value;

  const filtered =
    announcements.filter(a => {

      const matchesSearch =
        !search ||
        String(a.title || "")
          .toLowerCase()
          .includes(search) ||
        String(a.content || "")
          .toLowerCase()
          .includes(search);

      const matchesStatus =
        status === "all" ||
        a.status === status;

      const matchesPin =
        pin === "all" ||
        (pin === "pinned" && a.pinned) ||
        (pin === "normal" && !a.pinned);

      return (
        matchesSearch &&
        matchesStatus &&
        matchesPin
      );
    });

  if(!filtered.length){

    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <div>ยังไม่มีประกาศที่ตรงกับเงื่อนไข</div>
      </div>
    `;

    return;
  }

  list.innerHTML =
    filtered.map(
      announcementCard
    ).join("");
}

/* =========================
   CARD
========================= */

function announcementCard(a){

  const statusClass =
    a.status === "published"
      ? "published"
      : a.status === "draft"
        ? "draft"
        : "hidden";

  const statusText =
    a.status === "published"
      ? "เผยแพร่"
      : a.status === "draft"
        ? "ฉบับร่าง"
        : "ซ่อน";

  const image =
    a.image_url
      ? `
        <img
          class="announcement-image"
          src="${escapeAttr(a.image_url)}"
          alt=""
          onerror="this.style.display='none'"
        >
      `
      : "";

  return `
    <article class="announcement-card">

      ${image}

      <div class="announcement-body">

        <div class="card-top">

          <h3 class="card-title">
            ${escapeHtml(a.title)}
          </h3>

          <div class="badges">

            <span class="badge ${statusClass}">
              ${statusText}
            </span>

            ${
              a.pinned
                ? `
                  <span class="badge pinned">
                    📌 ปักหมุด
                  </span>
                `
                : ""
            }

          </div>

        </div>

        <div class="card-content">
          ${escapeHtml(a.content)}
        </div>

        <div class="card-date">
          สร้างเมื่อ ${formatDate(a.created_at)}
          ${
            a.updated_at &&
            a.updated_at !== a.created_at
              ? ` · แก้ไข ${formatDate(a.updated_at)}`
              : ""
          }
        </div>

        <div class="card-actions">

          <button
            class="card-btn edit-btn"
            onclick="openEditModal('${a.id}')"
          >
            ✏️ แก้ไข
          </button>

          <button
            class="card-btn pin-btn"
            onclick="togglePin('${a.id}', ${!a.pinned})"
          >
            ${a.pinned ? "📌 ยกเลิกหมุด" : "📌 ปักหมุด"}
          </button>

          <button
            class="card-btn delete-btn"
            onclick="deleteAnnouncement('${a.id}')"
          >
            🗑️ ลบ
          </button>

        </div>

      </div>

    </article>
  `;
}

/* =========================
   CREATE
========================= */

function openCreateModal(){

  editingId = null;

  document.getElementById(
    "modalTitle"
  ).textContent = "เพิ่มประกาศ";

  document.getElementById(
    "titleInput"
  ).value = "";

  document.getElementById(
    "contentInput"
  ).value = "";

  document.getElementById(
    "imageInput"
  ).value = "";

  document.getElementById(
    "statusInput"
  ).value = "published";

  document.getElementById(
    "pinnedInput"
  ).checked = false;

  hidePreview();

  document.getElementById(
    "modalBackdrop"
  ).classList.add("show");
}

/* =========================
   EDIT
========================= */

function openEditModal(id){

  const item =
    announcements.find(
      a => a.id === id
    );

  if(!item) return;

  editingId = id;

  document.getElementById(
    "modalTitle"
  ).textContent = "แก้ไขประกาศ";

  document.getElementById(
    "titleInput"
  ).value = item.title || "";

  document.getElementById(
    "contentInput"
  ).value = item.content || "";

  document.getElementById(
    "imageInput"
  ).value = item.image_url || "";

  document.getElementById(
    "statusInput"
  ).value =
    item.status || "published";

  document.getElementById(
    "pinnedInput"
  ).checked =
    item.pinned === true;

  previewImage();

  document.getElementById(
    "modalBackdrop"
  ).classList.add("show");
}

/* =========================
   CLOSE
========================= */

function closeModal(){

  document.getElementById(
    "modalBackdrop"
  ).classList.remove("show");

  editingId = null;
}

/* =========================
   SAVE
========================= */

async function saveAnnouncement(){

  const title =
    document.getElementById(
      "titleInput"
    ).value.trim();

  const content =
    document.getElementById(
      "contentInput"
    ).value.trim();

  const image_url =
    document.getElementById(
      "imageInput"
    ).value.trim();

  const status =
    document.getElementById(
      "statusInput"
    ).value;

  const pinned =
    document.getElementById(
      "pinnedInput"
    ).checked;

  if(!title){

    showToast(
      "กรุณาใส่หัวข้อประกาศ",
      "error"
    );

    return;
  }

  if(!content){

    showToast(
      "กรุณาใส่เนื้อหาประกาศ",
      "error"
    );

    return;
  }

  const payload = {
    title,
    content,
    image_url:
      image_url || null,
    status,
    pinned
  };

  const button =
    document.querySelector(
      ".save-btn"
    );

  button.disabled = true;
  button.textContent =
    "กำลังบันทึก...";

  let result;

  if(editingId){

    result =
      await supabaseClient
        .from("announcements")
        .update(payload)
        .eq("id", editingId);

  }else{

    result =
      await supabaseClient
        .from("announcements")
        .insert(payload);
  }

  button.disabled = false;
  button.textContent =
    "💾 บันทึกประกาศ";

  if(result.error){

    console.error(result.error);

    showToast(
      "บันทึกไม่สำเร็จ: " +
      result.error.message,
      "error"
    );

    return;
  }

  closeModal();

  showToast(
    editingId
      ? "แก้ไขประกาศเรียบร้อยแล้ว"
      : "เพิ่มประกาศเรียบร้อยแล้ว",
    "success"
  );

  await loadAnnouncements();
}

/* =========================
   PIN
========================= */

async function togglePin(
  id,
  pinned
){

  const {
    error
  } = await supabaseClient
    .from("announcements")
    .update({
      pinned
    })
    .eq("id", id);

  if(error){

    showToast(
      "เปลี่ยนสถานะหมุดไม่สำเร็จ",
      "error"
    );

    console.error(error);

    return;
  }

  showToast(
    pinned
      ? "ปักหมุดแล้ว"
      : "ยกเลิกหมุดแล้ว",
    "success"
  );

  await loadAnnouncements();
}

/* =========================
   DELETE
========================= */

async function deleteAnnouncement(id){

  const item =
    announcements.find(
      a => a.id === id
    );

  if(!item) return;

  const confirmed =
    confirm(
      `ต้องการลบประกาศนี้ใช่หรือไม่?\n\n${item.title}\n\nการลบไม่สามารถย้อนกลับได้`
    );

  if(!confirmed) return;

  const {
    error
  } = await supabaseClient
    .from("announcements")
    .delete()
    .eq("id", id);

  if(error){

    console.error(error);

    showToast(
      "ลบประกาศไม่สำเร็จ",
      "error"
    );

    return;
  }

  showToast(
    "ลบประกาศเรียบร้อยแล้ว",
    "success"
  );

  await loadAnnouncements();
}

/* =========================
   IMAGE PREVIEW
========================= */

function previewImage(){

  const url =
    document.getElementById(
      "imageInput"
    ).value.trim();

  const box =
    document.getElementById(
      "imagePreview"
    );

  const img =
    document.getElementById(
      "previewImg"
    );

  if(!url){

    hidePreview();
    return;
  }

  img.src = url;

  img.onload = () => {
    box.style.display = "block";
  };

  img.onerror = () => {
    box.style.display = "none";
  };
}

function hidePreview(){

  document.getElementById(
    "imagePreview"
  ).style.display = "none";

  document.getElementById(
    "previewImg"
  ).src = "";
}

/* =========================
   HELPERS
========================= */

function formatDate(date){

  if(!date) return "-";

  const d =
    new Date(date);

  return d.toLocaleString(
    "th-TH",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){

  return escapeHtml(value);
}

/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(
  message,
  type=""
){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.className =
    "toast show " + type;

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      toast.className =
        "toast";

    },3200);
}

/* =========================
   CLOSE MODAL BY BACKDROP
========================= */

document.getElementById(
  "modalBackdrop"
).addEventListener(
  "click",
  event => {

    if(
      event.target.id ===
      "modalBackdrop"
    ){
      closeModal();
    }

  }
);
</script>
