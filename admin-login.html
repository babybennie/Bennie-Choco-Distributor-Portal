<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Bennie Choco — Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:"Prompt",sans-serif;
  color:#3D405B;
  background:
    radial-gradient(circle at 15% 15%,rgba(160,196,255,.55),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(202,255,191,.55),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(253,255,182,.5),transparent 35%),
    #fffdf5;
  min-height:100svh;
  position:relative;
}

/* =========================
   CLOUDS
========================= */

.cloud{
  position:fixed;
  z-index:0;
  background:rgba(255,255,255,.78);
  border-radius:999px;
  filter:blur(.2px);
  pointer-events:none;
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud1{
  width:150px;
  height:48px;
  top:9%;
  left:-35px;
}

.cloud1::before{
  width:70px;
  height:70px;
  left:28px;
  bottom:4px;
}

.cloud1::after{
  width:58px;
  height:58px;
  left:82px;
  bottom:0;
}

.cloud2{
  width:180px;
  height:55px;
  top:31%;
  right:-60px;
}

.cloud2::before{
  width:80px;
  height:80px;
  left:35px;
  bottom:2px;
}

.cloud2::after{
  width:65px;
  height:65px;
  right:28px;
  bottom:0;
}

.cloud3{
  width:140px;
  height:44px;
  bottom:28%;
  left:-45px;
  opacity:.6;
}

.cloud3::before{
  width:58px;
  height:58px;
  left:30px;
  bottom:2px;
}

.cloud3::after{
  width:52px;
  height:52px;
  left:75px;
  bottom:0;
}

/* =========================
   FLOATING DECOR
========================= */

.float-item{
  position:fixed;
  z-index:1;
  width:70px;
  height:auto;
  pointer-events:none;
  user-select:none;
  opacity:.85;
}

.float1{
  top:14%;
  right:5%;
  transform:rotate(7deg);
}

.float2{
  top:54%;
  left:4%;
  width:58px;
  transform:rotate(-8deg);
  opacity:.7;
}

.float3{
  top:73%;
  right:5%;
  width:62px;
  transform:rotate(9deg);
  opacity:.65;
}

/* =========================
   MAIN
========================= */

.page{
  position:relative;
  z-index:3;
  width:100%;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    max(28px,env(safe-area-inset-top))
    18px
    150px
    18px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.9);
  border:2px solid rgba(160,196,255,.45);
  border-radius:30px;
  padding:30px 22px 26px;
  box-shadow:
    0 20px 60px rgba(92,116,160,.15),
    0 5px 18px rgba(92,116,160,.08);
  backdrop-filter:blur(14px);
}

/* =========================
   HEADER
========================= */

.logo-wrap{
  text-align:center;
  margin-bottom:24px;
}

.logo{
  width:82px;
  height:82px;
  margin:0 auto 12px;
  border-radius:50%;
  object-fit:cover;
  background:#fff;
  box-shadow:0 8px 20px rgba(92,116,160,.15);
}

.brand{
  font-size:25px;
  font-weight:700;
  color:#3D405B;
  line-height:1.25;
}

.subtitle{
  margin-top:5px;
  font-size:14px;
  color:#7b8099;
}

/* =========================
   FORM
========================= */

.form-group{
  margin-bottom:17px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:15px;
  font-weight:500;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;
  min-height:52px;
  border:1.5px solid #dbe5f5;
  border-radius:16px;
  background:#fff;
  padding:13px 46px 13px 15px;
  font-family:inherit;
  font-size:16px;
  color:#3D405B;
  outline:none;
  transition:.2s;
}

input:focus{
  border-color:#A0C4FF;
  box-shadow:0 0 0 4px rgba(160,196,255,.18);
}

input::placeholder{
  color:#a6abc0;
}

.toggle-password{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  border-radius:50%;
  cursor:pointer;
  color:#7d849d;
  font-size:18px;
}

/* =========================
   REMEMBER
========================= */

.remember-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin:2px 2px 19px;
  font-size:14px;
  color:#70768d;
}

.remember-row input{
  width:18px;
  min-height:18px;
  padding:0;
  accent-color:#8fb8ff;
  box-shadow:none;
}

/* =========================
   BUTTON
========================= */

.login-button{
  width:100%;
  min-height:54px;
  border:0;
  border-radius:17px;
  background:linear-gradient(135deg,#A0C4FF,#8fb8ff);
  color:#fff;
  font-family:inherit;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 9px 22px rgba(120,157,220,.25);
  transition:.2s;
}

.login-button:hover{
  transform:translateY(-1px);
}

.login-button:active{
  transform:translateY(1px);
}

.login-button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

/* =========================
   STATUS
========================= */

.status-box{
  display:none;
  margin-top:15px;
  padding:13px 14px;
  border-radius:15px;
  font-size:14px;
  line-height:1.6;
  text-align:center;
}

.status-box.show{
  display:block;
}

.status-box.error{
  background:#fff0f0;
  color:#b94b58;
  border:1px solid #ffd0d5;
}

.status-box.success{
  background:#effbea;
  color:#4f8c51;
  border:1px solid #ccecc7;
}

.status-box.info{
  background:#eef5ff;
  color:#5272a5;
  border:1px solid #d4e4ff;
}

/* =========================
   FOOTER LINKS
========================= */

.bottom-links{
  margin-top:22px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  font-size:14px;
}

.bottom-links a{
  color:#6e82aa;
  text-decoration:none;
}

.bottom-links a:hover{
  text-decoration:underline;
}

.dot{
  color:#c3c8d6;
}

/* =========================
   SECURITY NOTE
========================= */

.security-note{
  margin-top:20px;
  padding:13px 14px;
  border-radius:16px;
  background:rgba(253,255,182,.38);
  border:1px solid rgba(225,218,126,.35);
  font-size:12.5px;
  line-height:1.65;
  color:#777553;
  text-align:center;
}

/* =========================
   MUSIC
========================= */

.music-button{
  position:fixed;
  z-index:20;
  right:14px;
  bottom:95px;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  box-shadow:0 7px 22px rgba(70,90,130,.15);
  cursor:pointer;
  font-size:20px;
}

/* =========================
   BOTTOM FLOWER
========================= */

.bottom-flower{
  position:fixed;
  z-index:2;
  left:0;
  bottom:0;
  width:100%;
  max-width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(61,64,91,.28);
  backdrop-filter:blur(5px);
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:390px;
  background:#fff;
  border-radius:27px;
  padding:27px 21px 22px;
  box-shadow:0 25px 70px rgba(40,50,80,.2);
  text-align:center;
}

.modal-icon{
  font-size:38px;
  margin-bottom:7px;
}

.modal-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:8px;
}

.modal-text{
  font-size:14px;
  color:#737990;
  line-height:1.7;
  white-space:pre-line;
}

.modal-button{
  width:100%;
  margin-top:19px;
  min-height:49px;
  border:0;
  border-radius:15px;
  background:#A0C4FF;
  color:#fff;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){
  .login-card{
    padding:25px 17px 21px;
    border-radius:25px;
  }

  .brand{
    font-size:22px;
  }

  .subtitle{
    font-size:13px;
  }

  .float-item{
    width:52px;
  }

  .float2,
  .float3{
    width:46px;
  }
}
</style>
</head>

<body>

<!-- Clouds -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<!-- Floating decorations -->
<img
  class="float-item float1"
  src="https://i.postimg.cc/J7DGzDk1/IMG-8482.png"
  alt=""
  aria-hidden="true"
>

<img
  class="float-item float2"
  src="https://i.postimg.cc/J7DGzDk1/IMG-8482.png"
  alt=""
  aria-hidden="true"
>

<img
  class="float-item float3"
  src="https://i.postimg.cc/J7DGzDk1/IMG-8482.png"
  alt=""
  aria-hidden="true"
>

<main class="page">

  <section class="login-card">

    <div class="logo-wrap">

      <!-- เปลี่ยน URL โลโก้ตรงนี้ได้ -->
      <img
        class="logo"
        src="https://i.postimg.cc/125256.png"
        alt="Bennie Choco"
        onerror="this.style.display='none'"
      >

      <div class="brand">
        Bennie Choco
      </div>

      <div class="subtitle">
        ระบบเข้าสู่ระบบแอดมิน
      </div>

    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">
          อีเมลแอดมิน
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="กรอกอีเมล"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">
          รหัสผ่าน
        </label>

        <div class="input-wrap">

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="กรอกรหัสผ่าน"
            required
          >

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="แสดงรหัสผ่าน"
          >
            ♡
          </button>

        </div>
      </div>

      <label class="remember-row">
        <input
          type="checkbox"
          id="rememberEmail"
        >
        <span>จำอีเมลนี้ไว้ในเครื่อง</span>
      </label>

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        เข้าสู่ระบบแอดมิน
      </button>

      <div
        id="statusBox"
        class="status-box"
      ></div>

    </form>

    <div class="bottom-links">

      <a href="index.html">
        ← กลับหน้าหลัก
      </a>

    </div>

    <div class="security-note">
      🔒 ระบบตรวจสอบสิทธิ์แอดมินผ่าน Supabase<br>
      รหัสผ่านจะไม่ถูกบันทึกไว้ในเครื่อง
    </div>

  </section>

</main>

<!-- Music -->
<button
  class="music-button"
  id="musicButton"
  type="button"
  aria-label="เปิดเพลง"
>
  ♫
</button>

<!-- Bottom flower -->
<img
  class="bottom-flower"
  src="https://i.postimg.cc/fRjsbZCQ/Flower3.png"
  alt=""
  aria-hidden="true"
>

<!-- Modal -->
<div
  class="modal-backdrop"
  id="modalBackdrop"
>
  <div class="modal">

    <div
      class="modal-icon"
      id="modalIcon"
    >
      ☁️
    </div>

    <div
      class="modal-title"
      id="modalTitle"
    >
      -
    </div>

    <div
      class="modal-text"
      id="modalText"
    >
      -
    </div>

    <button
      class="modal-button"
      id="modalButton"
      type="button"
    >
      ตกลง
    </button>

  </div>
</div>

<script>
/* =====================================================
   SUPABASE CONFIG — ใช้โปรเจกต์ใหม่เท่านั้น
===================================================== */

const SUPABASE_URL =
  "https://arhvdvaugcjzkdbxesma.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Ctpm1h1NQKTdOPpY9yQ2qw_7kQg_57Z";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const rememberEmail =
  document.getElementById("rememberEmail");

const loginButton =
  document.getElementById("loginButton");

const statusBox =
  document.getElementById("statusBox");

const togglePassword =
  document.getElementById("togglePassword");

const modalBackdrop =
  document.getElementById("modalBackdrop");

const modalIcon =
  document.getElementById("modalIcon");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const modalButton =
  document.getElementById("modalButton");


/* =====================================================
   REMEMBER EMAIL
===================================================== */

const SAVED_EMAIL_KEY =
  "bennie_admin_email";

const savedEmail =
  localStorage.getItem(SAVED_EMAIL_KEY);

if(savedEmail){

  emailInput.value = savedEmail;

  rememberEmail.checked = true;

}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

togglePassword.addEventListener("click", () => {

  if(passwordInput.type === "password"){

    passwordInput.type = "text";

    togglePassword.textContent = "●";

  }else{

    passwordInput.type = "password";

    togglePassword.textContent = "♡";

  }

});


/* =====================================================
   STATUS
===================================================== */

function showStatus(message,type="info"){

  statusBox.textContent = message;

  statusBox.className =
    "status-box show " + type;

}


function clearStatus(){

  statusBox.textContent = "";

  statusBox.className =
    "status-box";

}


/* =====================================================
   MODAL
===================================================== */

function showModal(
  icon,
  title,
  text,
  buttonText="ตกลง",
  callback=null
){

  modalIcon.textContent = icon;

  modalTitle.textContent = title;

  modalText.textContent = text;

  modalButton.textContent = buttonText;

  modalBackdrop.classList.add("show");

  modalButton.onclick = () => {

    modalBackdrop.classList.remove("show");

    if(typeof callback === "function"){

      callback();

    }

  };

}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(userId){

  if(!userId){

    return false;

  }

  const { data, error } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", userId)
      .maybeSingle();

  if(error){

    console.error(
      "Admin check error:",
      error
    );

    return false;

  }

  return !!data;

}


/* =====================================================
   REDIRECT IF ALREADY ADMIN
===================================================== */

async function checkExistingSession(){

  try{

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();

    if(!session?.user){

      return;

    }

    const isAdmin =
      await checkAdmin(
        session.user.id
      );

    if(isAdmin){

      window.location.href =
        "admin.html";

    }

  }catch(error){

    console.error(
      "Session check error:",
      error
    );

  }

}

checkExistingSession();


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    clearStatus();

    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;

    if(!email || !password){

      showStatus(
        "กรุณากรอกอีเมลและรหัสผ่าน",
        "error"
      );

      return;

    }


    /* Remember email only */

    if(rememberEmail.checked){

      localStorage.setItem(
        SAVED_EMAIL_KEY,
        email
      );

    }else{

      localStorage.removeItem(
        SAVED_EMAIL_KEY
      );

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "กำลังตรวจสอบ...";


    try{

      /* ---------------------------------------------
         1. Login ผ่าน Supabase Auth
      --------------------------------------------- */

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({
            email: email,
            password: password
          });


      if(error){

        throw error;

      }


      if(!data?.user){

        throw new Error(
          "ไม่พบข้อมูลผู้ใช้"
        );

      }


      /* ---------------------------------------------
         2. ตรวจสอบว่า User เป็น Admin จริงหรือไม่
      --------------------------------------------- */

      const isAdmin =
        await checkAdmin(
          data.user.id
        );


      if(!isAdmin){

        await supabaseClient
          .auth
          .signOut();

        showModal(
          "🔐",
          "ไม่มีสิทธิ์แอดมิน",
          "อีเมลนี้เข้าสู่ระบบได้ แต่ยังไม่ได้รับสิทธิ์เป็นแอดมิน\n\nหากนี่คือบัญชีแอดมิน ให้เพิ่ม User UUID เข้าในตาราง admin_users ก่อน",
          "เข้าใจแล้ว"
        );

        return;

      }


      /* ---------------------------------------------
         3. Admin ผ่านแล้ว
      --------------------------------------------- */

      showStatus(
        "เข้าสู่ระบบสำเร็จ กำลังเปิดระบบแอดมิน...",
        "success"
      );


      setTimeout(() => {

        window.location.href =
          "admin.html";

      },500);


    }catch(error){

      console.error(
        "Login error:",
        error
      );


      let message =
        "เข้าสู่ระบบไม่สำเร็จ";


      if(error?.message){

        const msg =
          error.message.toLowerCase();


        if(
          msg.includes(
            "invalid login credentials"
          )
        ){

          message =
            "อีเมลหรือรหัสผ่านไม่ถูกต้อง";

        }else if(
          msg.includes(
            "email not confirmed"
          )
        ){

          message =
            "อีเมลนี้ยังไม่ได้รับการยืนยัน\nกรุณาปิด Confirm email ใน Supabase Authentication → Providers → Email หากต้องการใช้ระบบแบบอนุมัติจากแอดมิน";

        }else{

          message =
            error.message;

        }

      }


      showStatus(
        message,
        "error"
      );


    }finally{

      loginButton.disabled = false;

      loginButton.textContent =
        "เข้าสู่ระบบแอดมิน";

    }

  }
);


/* =====================================================
   CLOSE MODAL BY BACKDROP
===================================================== */

modalBackdrop.addEventListener(
  "click",
  (event) => {

    if(
      event.target === modalBackdrop
    ){

      modalBackdrop.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   MUSIC BUTTON
   ตอนนี้เป็นปุ่มตกแต่งไว้ก่อน
===================================================== */

const musicButton =
  document.getElementById(
    "musicButton"
  );

musicButton.addEventListener(
  "click",
  () => {

    showModal(
      "♫",
      "เพลง",
      "สามารถใส่เพลงประจำเว็บไซต์ในส่วนนี้ได้ภายหลัง",
      "ตกลง"
    );

  }
);
</script>

</body>
</html>
