<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Bennie Choco — Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#A0C4FF;
  --mint:#CAFFBF;
  --yellow:#FDFFB6;
  --cream:#FFFDF7;
  --white:#FFFFFF;
  --text:#3D405B;
  --muted:#7C8199;
  --shadow:0 18px 45px rgba(61,64,91,.10);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  font-family:"Prompt",sans-serif;
  color:var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(160,196,255,.42),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(202,255,191,.40),
      transparent 27%
    ),
    linear-gradient(
      180deg,
      #F9FCFF 0%,
      #FFFDF7 100%
    );

  overflow-x:hidden;
}

/* =========================
   CLOUDS
========================= */

.cloud{
  position:fixed;
  z-index:0;
  width:150px;
  height:52px;
  background:rgba(255,255,255,.72);
  border-radius:100px;
  pointer-events:none;
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud::before{
  width:65px;
  height:65px;
  left:28px;
  bottom:18px;
}

.cloud::after{
  width:82px;
  height:82px;
  right:20px;
  bottom:10px;
}

.cloud.one{
  top:90px;
  left:-45px;
  transform:scale(.85);
}

.cloud.two{
  top:190px;
  right:-55px;
  transform:scale(1.05);
}

.cloud.three{
  bottom:150px;
  left:-70px;
  transform:scale(.7);
  opacity:.55;
}

/* =========================
   PAGE
========================= */

.page{
  position:relative;
  z-index:3;

  width:100%;
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    max(24px,env(safe-area-inset-top))
    18px
    max(120px,calc(24px + env(safe-area-inset-bottom)));
}

.login-card{
  width:100%;
  max-width:430px;

  background:rgba(255,255,255,.90);

  border:1px solid rgba(160,196,255,.30);

  border-radius:30px;

  box-shadow:var(--shadow);

  padding:28px 22px 24px;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

/* =========================
   BRAND
========================= */

.brand{
  text-align:center;
  margin-bottom:24px;
}

.brand-icon{
  width:70px;
  height:70px;

  margin:0 auto 12px;

  border-radius:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--mint)
    );

  box-shadow:
    0 12px 25px rgba(160,196,255,.25);
}

.brand h1{
  margin:0;

  font-size:23px;
  font-weight:700;

  letter-spacing:-.3px;
}

.brand p{
  margin:6px 0 0;

  font-size:14px;

  color:var(--muted);
}

/* =========================
   FORM
========================= */

.form-group{
  margin-bottom:16px;
}

.form-label{
  display:block;

  margin-bottom:7px;

  font-size:14px;
  font-weight:500;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;
  min-height:50px;

  border:1px solid #E2E6EF;

  border-radius:16px;

  background:#fff;

  padding:0 15px;

  color:var(--text);

  font-family:inherit;
  font-size:16px;

  outline:none;

  transition:.2s ease;
}

input:focus{
  border-color:var(--blue);

  box-shadow:
    0 0 0 4px rgba(160,196,255,.18);
}

.password-input{
  padding-right:54px;
}

.toggle-password{
  position:absolute;

  right:7px;
  top:7px;

  width:38px;
  height:36px;

  border:0;

  border-radius:11px;

  background:#F5F7FB;

  color:var(--muted);

  font-size:17px;

  cursor:pointer;
}

/* =========================
   REMEMBER EMAIL
========================= */

.remember-row{
  display:flex;
  align-items:center;

  gap:9px;

  margin:3px 2px 18px;

  cursor:pointer;

  user-select:none;
}

.remember-row input{
  appearance:none;
  -webkit-appearance:none;

  width:19px;
  height:19px;

  min-height:19px;

  flex:0 0 19px;

  padding:0;

  border-radius:6px;

  border:1.5px solid #C8CDDA;

  background:#fff;

  cursor:pointer;

  position:relative;
}

.remember-row input:checked{
  background:var(--blue);
  border-color:var(--blue);
}

.remember-row input:checked::after{
  content:"✓";

  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;

  font-size:13px;
  font-weight:700;
}

.remember-text{
  font-size:14px;
  color:var(--text);
}

/* =========================
   LOGIN BUTTON
========================= */

.login-button{
  width:100%;
  min-height:54px;

  border:0;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #9DBFFF,
      #B8EFCB
    );

  color:#30405E;

  font-family:inherit;

  font-size:16px;
  font-weight:600;

  cursor:pointer;

  box-shadow:
    0 10px 22px rgba(160,196,255,.25);

  transition:.2s ease;
}

.login-button:active{
  transform:scale(.98);
}

.login-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =========================
   STATUS
========================= */

.status{
  display:none;

  margin-top:15px;

  padding:12px 14px;

  border-radius:14px;

  font-size:14px;

  line-height:1.6;
}

.status.show{
  display:block;
}

.status.error{
  background:#FFF0F2;
  color:#B94D5C;
  border:1px solid #FFD5DA;
}

.status.success{
  background:#F0FFF0;
  color:#4E8054;
  border:1px solid #D4F1D6;
}

/* =========================
   SECURITY NOTE
========================= */

.security-note{
  margin-top:18px;

  padding:12px 13px;

  border-radius:15px;

  background:
    rgba(253,255,182,.42);

  font-size:12.5px;

  line-height:1.65;

  color:#686B53;

  text-align:center;
}

/* =========================
   BACK HOME
========================= */

.back-home{
  display:block;

  margin-top:18px;

  text-align:center;

  color:var(--muted);

  text-decoration:none;

  font-size:14px;
}

.back-home:hover{
  text-decoration:underline;
}

/* =========================
   BOTTOM FLOWER
========================= */

.bottom-flower{
  position:fixed;

  z-index:2;

  left:0;
  bottom:0;

  width:100%;
  max-width:100%;

  height:auto;

  display:block;

  pointer-events:none;
  user-select:none;

  object-fit:contain;
  object-position:bottom center;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  z-index:20;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(45,48,68,.28);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:390px;

  background:#fff;

  border-radius:25px;

  padding:24px 20px 20px;

  box-shadow:
    0 25px 70px rgba(45,48,68,.20);

  text-align:center;
}

.modal-icon{
  width:58px;
  height:58px;

  margin:0 auto 12px;

  border-radius:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--mint)
    );
}

.modal-box h2{
  margin:0;

  font-size:20px;
}

.modal-box p{
  margin:8px 0 0;

  font-size:14px;

  line-height:1.7;

  color:var(--muted);
}

.modal-button{
  width:100%;

  min-height:48px;

  margin-top:17px;

  border:0;

  border-radius:15px;

  background:var(--blue);

  color:#30405E;

  font-family:inherit;

  font-size:15px;
  font-weight:600;

  cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  .login-card{
    padding:24px 18px 21px;
    border-radius:26px;
  }

  .brand h1{
    font-size:21px;
  }

  .brand-icon{
    width:64px;
    height:64px;
    font-size:30px;
  }

}
</style>
</head>

<body>

<!-- CLOUD DECORATION -->

<div class="cloud one"></div>
<div class="cloud two"></div>
<div class="cloud three"></div>


<!-- MAIN -->

<main class="page">

  <section class="login-card">

    <div class="brand">

      <div class="brand-icon">
        ♙
      </div>

      <h1>
        Bennie Choco Admin
      </h1>

      <p>
        เข้าสู่ระบบสำหรับผู้ดูแลระบบ
      </p>

    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">

      <div class="form-group">

        <label
          class="form-label"
          for="email"
        >
          อีเมลแอดมิน
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="admin@example.com"
          required
        >

      </div>


      <div class="form-group">

        <label
          class="form-label"
          for="password"
        >
          รหัสผ่าน
        </label>

        <div class="input-wrap">

          <input
            id="password"
            class="password-input"
            type="password"
            autocomplete="current-password"
            placeholder="กรอกรหัสผ่าน"
            required
          >

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="แสดงรหัสผ่าน"
          >
            ♡
          </button>

        </div>

      </div>


      <!-- REMEMBER EMAIL -->

      <label class="remember-row">

        <input
          type="checkbox"
          id="rememberEmail"
        >

        <span class="remember-text">
          จำอีเมลนี้ไว้ในเครื่อง
        </span>

      </label>


      <button
        class="login-button"
        id="loginButton"
        type="submit"
      >
        เข้าสู่ระบบแอดมิน
      </button>

    </form>


    <!-- STATUS -->

    <div
      id="status"
      class="status"
    ></div>


    <!-- SECURITY -->

    <div class="security-note">

      🔐 ระบบนี้สำหรับผู้ดูแล Bennie Choco เท่านั้น
      <br>

      กรุณาอย่าเปิดเผยรหัสผ่านให้ผู้อื่น

    </div>


    <!-- BACK -->

    <a
      href="index.html"
      class="back-home"
    >
      ← กลับหน้าแรก
    </a>

  </section>

</main>


<!-- BOTTOM FLOWER -->

<img
  class="bottom-flower"
  src="https://i.postimg.cc/fRjsbZCQ/Flower3.png"
  alt=""
  aria-hidden="true"
>


<!-- MODAL -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-box">

    <div
      class="modal-icon"
      id="modalIcon"
    >
      ♡
    </div>

    <h2 id="modalTitle">
      แจ้งเตือน
    </h2>

    <p id="modalText"></p>

    <button
      class="modal-button"
      id="modalButton"
    >
      ตกลง
    </button>

  </div>

</div>


<script>

/* =====================================================
   NEW SUPABASE PROJECT
   Bennie Choco Distributor Portal
===================================================== */

const SUPABASE_URL =
  "https://arhvdvaugcjzkdbxesma.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Ctpm1h1NQKTdOPpY9yQ2qw_7kQg_57Z";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const rememberEmail =
  document.getElementById("rememberEmail");

const loginButton =
  document.getElementById("loginButton");

const togglePassword =
  document.getElementById("togglePassword");

const statusBox =
  document.getElementById("status");

const modal =
  document.getElementById("modal");

const modalIcon =
  document.getElementById("modalIcon");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const modalButton =
  document.getElementById("modalButton");


/* =====================================================
   REMEMBER EMAIL
   เก็บเฉพาะอีเมลในเครื่อง
   ไม่เก็บรหัสผ่าน
===================================================== */

const SAVED_EMAIL_KEY =
  "bennie_admin_email";

const savedAdminEmail =
  localStorage.getItem(
    SAVED_EMAIL_KEY
  );

if(savedAdminEmail){

  emailInput.value =
    savedAdminEmail;

  rememberEmail.checked = true;

}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

togglePassword.addEventListener(
  "click",
  () => {

    if(passwordInput.type === "password"){

      passwordInput.type = "text";

      togglePassword.textContent =
        "◉";

      togglePassword.setAttribute(
        "aria-label",
        "ซ่อนรหัสผ่าน"
      );

    }else{

      passwordInput.type =
        "password";

      togglePassword.textContent =
        "♡";

      togglePassword.setAttribute(
        "aria-label",
        "แสดงรหัสผ่าน"
      );

    }

  }
);


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  message,
  type = "error"
){

  statusBox.textContent =
    message;

  statusBox.className =
    "status show " + type;

}


/* =====================================================
   MODAL
===================================================== */

function showModal(
  title,
  text,
  icon = "♡",
  buttonText = "ตกลง",
  callback = null
){

  modalIcon.textContent =
    icon;

  modalTitle.textContent =
    title;

  modalText.textContent =
    text;

  modalButton.textContent =
    buttonText;

  modal.classList.add("show");

  modalButton.onclick = () => {

    modal.classList.remove(
      "show"
    );

    if(
      typeof callback ===
      "function"
    ){

      callback();

    }

  };

}


/* =====================================================
   CHECK ADMIN FROM SUPABASE
===================================================== */

async function checkAdmin(
  userId
){

  /*
    ตรวจจากตาราง:

    public.admin_users

    ใน Supabase โปรเจกต์ใหม่
  */

  const {
    data,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq(
        "user_id",
        userId
      )
      .maybeSingle();


  if(error){

    console.error(
      "Admin check error:",
      error
    );

    return {
      isAdmin:false,
      error
    };

  }


  return {
    isAdmin:!!data,
    error:null
  };

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    statusBox.className =
      "status";


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if(
      !email ||
      !password
    ){

      showStatus(
        "กรุณากรอกอีเมลและรหัสผ่าน",
        "error"
      );

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "กำลังตรวจสอบ...";


    /* ---------------------------------------------
       จำอีเมล
    --------------------------------------------- */

    if(
      rememberEmail.checked
    ){

      localStorage.setItem(
        SAVED_EMAIL_KEY,
        email
      );

    }else{

      localStorage.removeItem(
        SAVED_EMAIL_KEY
      );

    }


    /* ---------------------------------------------
       LOGIN VIA SUPABASE AUTH
    --------------------------------------------- */

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email:email,

          password:password

        });


    /* ---------------------------------------------
       LOGIN ERROR
    --------------------------------------------- */

    if(error){

      console.error(
        "Supabase login error:",
        error
      );

      loginButton.disabled =
        false;

      loginButton.textContent =
        "เข้าสู่ระบบแอดมิน";


      let message =
        "อีเมลหรือรหัสผ่านไม่ถูกต้อง";


      if(
        error.message
          ?.toLowerCase()
          .includes(
            "email not confirmed"
          )
      ){

        message =
          "อีเมลนี้ยังไม่ได้รับการยืนยันใน Supabase";

      }


      showStatus(
        message,
        "error"
      );

      return;

    }


    /* ---------------------------------------------
       NO USER
    --------------------------------------------- */

    if(
      !data ||
      !data.user
    ){

      loginButton.disabled =
        false;

      loginButton.textContent =
        "เข้าสู่ระบบแอดมิน";

      showStatus(
        "ไม่สามารถเข้าสู่ระบบได้ กรุณาลองใหม่",
        "error"
      );

      return;

    }


    /* ---------------------------------------------
       CHECK ADMIN TABLE
    --------------------------------------------- */

    const adminResult =
      await checkAdmin(
        data.user.id
      );


    /* ---------------------------------------------
       SUPABASE QUERY ERROR
    --------------------------------------------- */

    if(
      adminResult.error
    ){

      await supabaseClient.auth
        .signOut();


      loginButton.disabled =
        false;

      loginButton.textContent =
        "เข้าสู่ระบบแอดมิน";


      showStatus(
        "ไม่สามารถตรวจสอบสิทธิ์แอดมินได้ กรุณาตรวจสอบตาราง admin_users ใน Supabase",
        "error"
      );

      return;

    }


    /* ---------------------------------------------
       NOT ADMIN
    --------------------------------------------- */

    if(
      !adminResult.isAdmin
    ){

      await supabaseClient.auth
        .signOut();


      loginButton.disabled =
        false;

      loginButton.textContent =
        "เข้าสู่ระบบแอดมิน";


      showModal(
        "ไม่มีสิทธิ์เข้าใช้งาน",
        "บัญชีนี้เข้าสู่ระบบได้ แต่ยังไม่ได้ถูกกำหนดเป็นผู้ดูแลระบบใน Supabase",
        "⚠️",
        "กลับไปหน้า Login"
      );

      return;

    }


    /* ---------------------------------------------
       ADMIN LOGIN SUCCESS
    --------------------------------------------- */

    loginButton.textContent =
      "เข้าสู่ระบบสำเร็จ ✓";


    showModal(
      "เข้าสู่ระบบสำเร็จ",
      "ยินดีต้อนรับเข้าสู่ระบบจัดการ Bennie Choco",
      "☁️",
      "เข้าสู่ Admin",
      () => {

        window.location.href =
          "admin.html";

      }
    );

  }
);


/* =====================================================
   CHECK EXISTING SUPABASE SESSION
===================================================== */

async function checkExistingSession(){

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if(error){

    console.error(
      "Session error:",
      error
    );

    return;

  }


  const session =
    data?.session;


  if(
    !session ||
    !session.user
  ){

    return;

  }


  /*
    มี session อยู่แล้ว
    แต่ยังต้องตรวจ admin_users
    ทุกครั้งก่อนเข้า admin.html
  */

  const adminResult =
    await checkAdmin(
      session.user.id
    );


  if(
    adminResult.isAdmin
  ){

    window.location.href =
      "admin.html";

  }else{

    await supabaseClient.auth
      .signOut();

  }

}


/* =====================================================
   START
===================================================== */

checkExistingSession();

</script>

</body>
</html>
