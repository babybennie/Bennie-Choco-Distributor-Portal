<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bennie Choco Admin — สินค้า</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Niramit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#A0C4FF;
  --blue-soft:#EAF3FF;
  --mint:#CAFFBF;
  --yellow:#FDFFB6;
  --cream:#FFFDF5;
  --white:#fff;
  --text:#3D405B;
  --muted:#7B819A;
  --line:#E8EDF5;

  --green:#62B978;
  --green-bg:#EAF8ED;

  --orange:#E9A23B;
  --orange-bg:#FFF4DF;

  --red:#D96B6B;
  --red-bg:#FFF0F0;

  --shadow:0 14px 35px rgba(61,64,91,.09);
  --shadow-soft:0 8px 22px rgba(61,64,91,.07);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:'Niramit',sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 8%,rgba(160,196,255,.38),transparent 25%),
    radial-gradient(circle at 92% 15%,rgba(202,255,191,.34),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(253,255,182,.24),transparent 30%),
    var(--cream);
  overflow-x:hidden;
}

/* CLOUDS */

.cloud{
  position:fixed;
  border-radius:999px;
  background:rgba(255,255,255,.78);
  z-index:-2;
  pointer-events:none;
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud::before{
  width:55%;
  height:140%;
  left:12%;
  bottom:0;
}

.cloud::after{
  width:48%;
  height:125%;
  right:10%;
  bottom:0;
}

.cloud-1{
  width:190px;
  height:55px;
  top:105px;
  left:-45px;
}

.cloud-2{
  width:220px;
  height:62px;
  top:280px;
  right:-65px;
}

.cloud-3{
  width:150px;
  height:45px;
  bottom:90px;
  left:-35px;
}

.floating{
  position:fixed;
  width:72px;
  height:72px;
  object-fit:contain;
  opacity:.7;
  z-index:-1;
  pointer-events:none;
  animation:float 5s ease-in-out infinite;
}

.float-1{
  right:4%;
  top:120px;
}

.float-2{
  left:3%;
  bottom:110px;
  animation-delay:1.3s;
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }
  50%{
    transform:translateY(-10px) rotate(2deg);
  }
}

/* TOPBAR */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.85);
}

.topbar-inner{
  width:min(1180px,calc(100% - 28px));
  min-height:76px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.brand-icon{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:16px;
  background:linear-gradient(145deg,#fff,var(--blue-soft));
  border:1px solid rgba(160,196,255,.5);
  box-shadow:var(--shadow-soft);
  font-size:24px;
  flex:none;
}

.brand-title{
  font-size:19px;
  font-weight:700;
  line-height:1.15;
}

.brand-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.top-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  text-decoration:none;
  border-radius:12px;
  padding:9px 13px;
  font-family:inherit;
  font-size:13px;
  cursor:pointer;
}

.top-btn:hover{
  box-shadow:var(--shadow-soft);
  transform:translateY(-1px);
}

/* PAGE */

.container{
  width:min(1180px,calc(100% - 28px));
  margin:auto;
  padding:30px 0 70px;
}

.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}

.kicker{
  color:#7290C0;
  font-size:13px;
  font-weight:600;
}

.page-title{
  margin:2px 0 0;
  font-size:32px;
  line-height:1.15;
}

.page-desc{
  margin:7px 0 0;
  color:var(--muted);
  font-size:14px;
}

.primary-btn{
  border:0;
  border-radius:13px;
  background:var(--blue);
  color:var(--text);
  padding:11px 16px;
  font-family:inherit;
  font-size:13px;
  cursor:pointer;
  box-shadow:var(--shadow-soft);
}

.primary-btn:hover{
  transform:translateY(-1px);
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  padding:18px;
  border-radius:20px;
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow-soft);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-number{
  margin-top:4px;
  font-size:29px;
  font-weight:700;
}

.stat.all{
  background:linear-gradient(135deg,#fff,#EEF5FF);
}

.stat.active{
  background:linear-gradient(135deg,#fff,#EFFBF1);
}

.stat.hidden{
  background:linear-gradient(135deg,#fff,#FFF8E8);
}

.stat.stock{
  background:linear-gradient(135deg,#fff,#FFF0F0);
}

/* FILTER */

.filter-box{
  padding:16px;
  margin-bottom:20px;
  border-radius:20px;
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:var(--shadow-soft);
}

.filters{
  display:grid;
  grid-template-columns:minmax(220px,1fr) 190px auto;
  gap:10px;
}

.input,
.select{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  outline:none;
}

.input:focus,
.select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(160,196,255,.18);
}

.filter-count{
  min-width:110px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:var(--blue-soft);
  color:#5877A8;
  font-size:13px;
}

/* PRODUCTS */

.list-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 2px 10px;
}

.list-title{
  font-size:17px;
  font-weight:700;
}

.list-note{
  color:var(--muted);
  font-size:12px;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.product-card{
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:21px;
  overflow:hidden;
  box-shadow:var(--shadow-soft);
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.product-image{
  position:relative;
  width:100%;
  height:210px;
  background:linear-gradient(145deg,#F3F7FF,#FAFFF7);
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-image{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  font-size:42px;
  color:#AEB7C9;
}

.badges{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

.badge{
  padding:5px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(8px);
  font-size:10px;
  font-weight:600;
}

.badge.new{
  color:#4D8B5D;
  background:rgba(234,248,237,.94);
}

.badge.status-active{
  color:#398A50;
}

.badge.status-hidden{
  color:#A36C14;
}

.badge.status-out{
  color:#BD5050;
}

.product-body{
  padding:16px;
}

.category{
  color:#7790B6;
  font-size:11px;
  margin-bottom:3px;
}

.product-name{
  font-size:18px;
  font-weight:700;
  line-height:1.25;
  word-break:break-word;
}

.description{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  margin-top:6px;
  min-height:38px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.prices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:13px;
}

.price-box{
  padding:9px 10px;
  border-radius:12px;
  background:#FAFBFD;
  border:1px solid #EEF1F5;
}

.price-label{
  color:var(--muted);
  font-size:10px;
}

.price{
  margin-top:1px;
  font-size:15px;
  font-weight:700;
}

.product-actions{
  display:flex;
  gap:7px;
  margin-top:13px;
}

.small-btn{
  flex:1;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:10px;
  padding:9px 8px;
  font-family:inherit;
  font-size:11px;
  cursor:pointer;
}

.small-btn.edit{
  background:var(--blue-soft);
  color:#5877A8;
  border-color:#DCE9FF;
}

.small-btn.hide{
  background:var(--orange-bg);
  color:#A36C14;
  border-color:#F4E1B8;
}

.small-btn.show{
  background:var(--green-bg);
  color:#398A50;
  border-color:#D0EED6;
}

.small-btn.out{
  background:var(--red-bg);
  color:#BD5050;
  border-color:#F2D4D4;
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  padding:55px 20px;
  text-align:center;
  border:1px dashed #DCE3EE;
  border-radius:20px;
  background:rgba(255,255,255,.9);
  color:var(--muted);
}

.empty-icon{
  font-size:42px;
  margin-bottom:7px;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(61,64,91,.38);
  backdrop-filter:blur(6px);
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(560px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:25px;
  box-shadow:0 30px 80px rgba(61,64,91,.25);
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:18px;
}

.modal-title{
  margin:0;
  font-size:21px;
}

.modal-sub{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
}

.close-btn{
  width:36px;
  height:36px;
  border:0;
  border-radius:11px;
  background:#F5F7FA;
  color:var(--text);
  font-size:19px;
  cursor:pointer;
}

.form{
  display:grid;
  gap:13px;
}

.field{
  display:grid;
  gap:5px;
}

.field label{
  font-size:12px;
  font-weight:600;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--text);
  font-family:inherit;
  font-size:13px;
  outline:none;
}

.field textarea{
  min-height:95px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(160,196,255,.18);
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.image-preview{
  display:none;
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid var(--line);
  margin-top:5px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:5px;
}

.modal-actions button{
  flex:1;
}

.cancel-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:12px;
  padding:11px;
  font-family:inherit;
  cursor:pointer;
}

.save-btn{
  border:0;
  background:var(--blue);
  color:var(--text);
  border-radius:12px;
  padding:11px;
  font-family:inherit;
  cursor:pointer;
  font-weight:600;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:200;
  max-width:calc(100% - 30px);
  padding:12px 17px;
  border-radius:13px;
  color:#fff;
  background:#3D405B;
  font-size:13px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,20px);
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.toast.success{
  background:#4E9A61;
}

.toast.error{
  background:#C85B5B;
}

/* LOADING */

.loading{
  grid-column:1/-1;
  padding:50px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:30px;
  height:30px;
  margin:0 auto 12px;
  border:3px solid #E5ECF6;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* RESPONSIVE */

@media(max-width:950px){

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .filters{
    grid-template-columns:1fr 180px;
  }

  .filter-count{
    min-height:43px;
  }
}

@media(max-width:650px){

  .topbar-inner{
    min-height:68px;
  }

  .brand-icon{
    width:42px;
    height:42px;
    border-radius:14px;
  }

  .brand-title{
    font-size:16px;
  }

  .brand-sub{
    font-size:10px;
  }

  .top-btn{
    padding:8px 10px;
    font-size:11px;
  }

  .container{
    width:calc(100% - 20px);
    padding-top:22px;
  }

  .page-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .page-title{
    font-size:27px;
  }

  .primary-btn{
    width:100%;
  }

  .stats{
    gap:9px;
  }

  .stat{
    padding:14px;
    border-radius:17px;
  }

  .stat-number{
    font-size:25px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr;
  }

  .product-image{
    height:230px;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .floating{
    width:55px;
    height:55px;
  }
}
</style>
</head>

<body>

<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>

<img
  class="floating float-1"
  src="https://i.postimg.cc/J7DGzDk1/IMG-8482.png"
  alt=""
>

<img
  class="floating float-2"
  src="https://i.postimg.cc/J7DGzDk1/IMG-8482.png"
  alt=""
>


<header class="topbar">

  <div class="topbar-inner">

    <div class="brand">

      <div class="brand-icon">
        🍫
      </div>

      <div>
        <div class="brand-title">
          Bennie Choco Admin
        </div>

        <div class="brand-sub">
          จัดการสินค้า
        </div>
      </div>

    </div>


    <div class="top-actions">

      <a
        class="top-btn"
        href="admin.html"
      >
        ← หน้าหลัก
      </a>

      <button
        class="top-btn"
        id="logoutBtn"
      >
        ออกจากระบบ
      </button>

    </div>

  </div>

</header>


<main class="container">

  <section class="page-head">

    <div>

      <div class="kicker">
        PRODUCT MANAGEMENT
      </div>

      <h1 class="page-title">
        จัดการสินค้า
      </h1>

      <p class="page-desc">
        เพิ่ม แก้ไข ซ่อน และจัดการราคาสินค้าสำหรับตัวแทน
      </p>

    </div>


    <button
      class="primary-btn"
      id="addProductBtn"
    >
      ＋ เพิ่มสินค้า
    </button>

  </section>


  <!-- STATS -->

  <section class="stats">

    <div class="stat all">

      <div class="stat-label">
        สินค้าทั้งหมด
      </div>

      <div
        class="stat-number"
        id="allCount"
      >
        0
      </div>

    </div>


    <div class="stat active">

      <div class="stat-label">
        แสดงอยู่
      </div>

      <div
        class="stat-number"
        id="activeCount"
      >
        0
      </div>

    </div>


    <div class="stat hidden">

      <div class="stat-label">
        ซ่อน
      </div>

      <div
        class="stat-number"
        id="hiddenCount"
      >
        0
      </div>

    </div>


    <div class="stat stock">

      <div class="stat-label">
        สินค้าหมด
      </div>

      <div
        class="stat-number"
        id="outCount"
      >
        0
      </div>

    </div>

  </section>


  <!-- FILTER -->

  <section class="filter-box">

    <div class="filters">

      <input
        class="input"
        id="searchInput"
        type="search"
        placeholder="ค้นหาชื่อสินค้า / รายละเอียด / หมวดหมู่..."
      >


      <select
        class="select"
        id="statusFilter"
      >

        <option value="all">
          ทุกสถานะ
        </option>

        <option value="active">
          แสดงอยู่
        </option>

        <option value="hidden">
          ซ่อน
        </option>

        <option value="out_of_stock">
          สินค้าหมด
        </option>

      </select>


      <div
        class="filter-count"
        id="filterCount"
      >
        0 รายการ
      </div>

    </div>

  </section>


  <div class="list-head">

    <div class="list-title">
      รายการสินค้า
    </div>

    <div
      class="list-note"
      id="lastUpdated"
    >
      —
    </div>

  </div>


  <section
    class="products"
    id="productList"
  >

    <div class="loading">

      <div class="spinner"></div>

      กำลังโหลดสินค้า...

    </div>

  </section>

</main>


<!-- PRODUCT MODAL -->

<div
  class="modal-bg"
  id="productModal"
>

  <div class="modal">

    <div class="modal-head">

      <div>

        <h2
          class="modal-title"
          id="modalTitle"
        >
          เพิ่มสินค้า
        </h2>

        <p class="modal-sub">
          ข้อมูลนี้จะบันทึกลงในตาราง products
        </p>

      </div>

      <button
        class="close-btn"
        id="closeModalBtn"
      >
        ×
      </button>

    </div>


    <form
      class="form"
      id="productForm"
    >

      <input
        type="hidden"
        id="productId"
      >


      <div class="field">

        <label>
          ชื่อสินค้า *
        </label>

        <input
          id="productName"
          required
          maxlength="200"
          placeholder="เช่น Chocolate Brownie"
        >

      </div>


      <div class="field">

        <label>
          หมวดหมู่
        </label>

        <input
          id="productCategory"
          maxlength="100"
          placeholder="เช่น ขนม / เครื่องดื่ม"
        >

      </div>


      <div class="field">

        <label>
          รายละเอียด
        </label>

        <textarea
          id="productDescription"
          placeholder="รายละเอียดสินค้า..."
        ></textarea>

      </div>


      <div class="field">

        <label>

        <img

          alt="ตัวอย่างรูปสินค้า"
        >

      </div>


      <div class="form-row">

        <div class="field">

          <label>
            ราคาปกติ (บาท)
          </label>

          <input
            id="retailPrice"
            type="number"
            min="0"
            step="0.01"
            placeholder="99.00"
          >

        </div>


        <div class="field">

          <label>
            ราคาตัวแทน (บาท)
          </label>

          <input
            id="distributorPrice"
            type="number"
            min="0"
            step="0.01"
            placeholder="79.00"
          >

        </div>

      <div class="form-row">

        <div class="field">

          <label>
            สถานะ
          </label>

          <select id="productStatus">

            <option value="active">
              แสดงอยู่
            </option>

            <option value="hidden">
              ซ่อน
            </option>

            <option value="out_of_stock">
              สินค้าหมด
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            ลำดับการแสดง

          <input

        </button>

      </div>

    </form>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://arhvdvaugcjzkdbxesma.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Ctpm1h1NQKTdOPpY9yQ2qw_7kQg_57Z";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   STATE
========================================================= */

let products = [];

let editingId = null;


/* =========================================================
   ELEMENTS
========================================================= */

const productList =
  document.getElementById("productList");

const searchInput =
  document.getElementById("searchInput");

const statusFilter =
  document.getElementById("statusFilter");

const filterCount =
  document.getElementById("filterCount");

const productModal =
  document.getElementById("productModal");

const productForm =
  document.getElementById("productForm");

const modalTitle =
  document.getElementById("modalTitle");

const productId =
  document.getElementById("productId");

const productName =
  document.getElementById("productName");

const productCategory =
  document.getElementById("productCategory");

const productDescription =
  document.getElementById("productDescription");

const productImage =
  document.getElementById("productImage");

const imagePreview =
  document.getElementById("imagePreview");

const retailPrice =
  document.getElementById("retailPrice");

const distributorPrice =
  document.getElementById("distributorPrice");

const productStatus =
  document.getElementById("productStatus");

const sortOrder =
  document.getElementById("sortOrder");

const saveBtn =
  document.getElementById("saveBtn");

const toast =
  document.getElementById("toast");


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatPrice(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "—";
  }

  const number =
    Number(value);

  if(
    Number.isNaN(number)
  ){
    return "—";
  }

  return number.toLocaleString(
    "th-TH",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  ) + " ฿";
}


function formatDate(value){

  if(!value){
    return "—";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "—";
  }

  return date.toLocaleString(
    "th-TH",
    {
      day:"numeric",
      month:"short",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function isNewProduct(createdAt){

  if(!createdAt){
    return false;
  }

  const created =
    new Date(createdAt)
      .getTime();

  const now =
    Date.now();

  const sevenDays =
    7 * 24 * 60 * 60 * 1000;

  return (
    now - created <= sevenDays &&
    now - created >= 0
  );
}


function statusLabel(status){

  const map = {
    active:"แสดงอยู่",
    hidden:"ซ่อน",
    out_of_stock:"สินค้าหมด"
  };

  return map[status] ||
    status ||
    "—";
}


function showToast(
  message,
  type=""
){

  toast.textContent =
    message;

  toast.className =
    "toast show " + type;

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(() => {

      toast.className =
        "toast";

    },3000);
}


/* =========================================================
   AUTH
========================================================= */

async function checkAdmin(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if(!session){

    window.location.href =
      "admin-login.html";

    return false;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .rpc("is_admin");


  if(
    error ||
    !data
  ){

    await supabaseClient
      .auth
      .signOut();

    window.location.href =
      "admin-login.html";

    return false;
  }


  return true;
}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

  productList.innerHTML = `
    <div class="loading">

      <div class="spinner"></div>

      กำลังโหลดสินค้า...

    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select(`
        id,
        name,
        category,
        description,
        image_url,
        retail_price,
        distributor_price,
        status,
        sort_order,
        created_at,
        updated_at
      `)
      .order(
        "sort_order",
        {
          ascending:true
        }
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    productList.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <div>
          โหลดสินค้าไม่สำเร็จ
        </div>

        <div style="font-size:12px;margin-top:6px;">
          ${escapeHtml(error.message)}
        </div>

      </div>
    `;

    showToast(
      "โหลดสินค้าไม่สำเร็จ",
      "error"
    );

    return;
  }


  products =
    data || [];


  updateStats();

  applyFilters();


  document.getElementById(
    "lastUpdated"
  ).textContent =
    "อัปเดต " +
    new Date()
      .toLocaleTimeString(
        "th-TH",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  const all =
    products.length;

  const active =
    products.filter(
      p => p.status === "active"
    ).length;

  const hidden =
    products.filter(
      p => p.status === "hidden"
    ).length;

  const out =
    products.filter(
      p => p.status === "out_of_stock"
    ).length;


  document.getElementById(
    "allCount"
  ).textContent = all;

  document.getElementById(
    "activeCount"
  ).textContent = active;

  document.getElementById(
    "hiddenCount"
  ).textContent = hidden;

  document.getElementById(
    "outCount"
  ).textContent = out;
}


/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();

  const status =
    statusFilter.value;


  const filtered =
    products.filter(product => {

      const searchable = [

        product.name,
        product.category,
        product.description

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      const keywordMatch =
        !keyword ||
        searchable.includes(keyword);


      const statusMatch =
        status === "all" ||
        product.status === status;


      return (
        keywordMatch &&
        statusMatch
      );

    });


  renderProducts(filtered);
}


/* =========================================================
   RENDER
========================================================= */

function renderProducts(list){

  filterCount.textContent =
    `${list.length} รายการ`;


  if(!list.length){

    productList.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          🍫
        </div>

        <div>
          ยังไม่มีสินค้าที่ตรงกับเงื่อนไข
        </div>

        <div style="font-size:12px;margin-top:6px;">
          ลองเปลี่ยนคำค้นหา หรือเพิ่มสินค้าใหม่
        </div>

      </div>
    `;

    return;
  }


  productList.innerHTML =
    list
      .map(renderProduct)
      .join("");
}


function renderProduct(product){

  const image =
    product.image_url
      ? `
        <img
          src="${escapeHtml(product.image_url)}"
          alt="${escapeHtml(product.name)}"
          loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='grid';"
        >

        <div
          class="no-image"
          style="display:none;"
        >
          🍫
        </div>
      `
      : `
        <div class="no-image">
          🍫
        </div>
      `;


  let actionButtons = `

    <button
      class="small-btn edit"
      onclick="openEdit('${product.id}')"
    >
      แก้ไข
    </button>

  `;


  if(product.status === "active"){

    actionButtons += `

      <button
        class="small-btn hide"
        onclick="changeStatus('${product.id}','hidden')"
      >
        ซ่อน
      </button>

      <button
        class="small-btn out"
        onclick="changeStatus('${product.id}','out_of_stock')"
      >
        หมด
      </button>

    `;

  }
  else if(product.status === "hidden"){

    actionButtons += `

      <button
        class="small-btn show"
        onclick="changeStatus('${product.id}','active')"
      >
        แสดง
      </button>

    `;

  }
  else if(product.status === "out_of_stock"){

    actionButtons += `

      <button
        class="small-btn show"
        onclick="changeStatus('${product.id}','active')"
      >
        มีสินค้า
      </button>

      <button
        class="small-btn hide"
        onclick="changeStatus('${product.id}','hidden')"
      >
        ซ่อน
      </button>

    `;

  }


  return `

    <article class="product-card">

      <div class="product-image">

        ${image}

        <div class="badges">

          <div>

            ${
              isNewProduct(product.created_at)
              ? `
                <span class="badge new">
                  ✦ ใหม่
                </span>
              `
              : ""
            }

          </div>


          <span class="badge status-${escapeHtml(product.status)}">

            ${escapeHtml(
              statusLabel(product.status)
            )}

          </span>

        </div>

      </div>


      <div class="product-body">

        <div class="category">
          ${escapeHtml(
            product.category || "ไม่ระบุหมวดหมู่"
          )}
        </div>


        <div class="product-name">
          ${escapeHtml(
            product.name
          )}
        </div>


        <div class="description">
          ${escapeHtml(
            product.description ||
            "ไม่มีรายละเอียดสินค้า"
          )}
        </div>


        <div class="prices">

          <div class="price-box">

            <div class="price-label">
              ราคาปกติ
            </div>

            <div class="price">
              ${formatPrice(
                product.retail_price
              )}
            </div>

          </div>


          <div class="price-box">

            <div class="price-label">
              ราคาตัวแทน
            </div>

            <div class="price">
              ${formatPrice(
                product.distributor_price
              )}
            </div>

          </div>

        </div>


        <div class="product-actions">

          ${actionButtons}

        </div>

      </div>

    </article>

  `;
}


/* =========================================================
   OPEN ADD
========================================================= */

function openAdd(){

  editingId =
    null;

  productId.value =
    "";

  modalTitle.textContent =
    "เพิ่มสินค้า";

  productName.value =
    "";

  productCategory.value =
    "";

  productDescription.value =
    "";

  productImage.value =
    "";

  retailPrice.value =
    "";

  distributorPrice.value =
    "";

  productStatus.value =
    "active";

  sortOrder.value =
    "0";

  imagePreview.style.display =
    "none";

  imagePreview.removeAttribute(
    "src"
  );


  productModal.classList.add(
    "show"
  );


  setTimeout(() => {

    productName.focus();

  },100);

}


/* =========================================================
   OPEN EDIT
========================================================= */

function openEdit(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product){
    return;
  }


  editingId =
    id;

  productId.value =
    id;

  modalTitle.textContent =
    "แก้ไขสินค้า";

  productName.value =
    product.name || "";

  productCategory.value =
    product.category || "";

  productDescription.value =
    product.description || "";

  productImage.value =
    product.image_url || "";

  retailPrice.value =
    product.retail_price ?? "";

  distributorPrice.value =
    product.distributor_price ?? "";

  productStatus.value =
    product.status || "active";

  sortOrder.value =
    product.sort_order ?? 0;


  updateImagePreview();


  productModal.classList.add(
    "show"
  );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeProductModal(){

  productModal.classList.remove(
    "show"
  );

  editingId =
    null;
}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function updateImagePreview(){

  const url =
    productImage.value.trim();


  if(!url){

    imagePreview.style.display =
      "none";

    imagePreview.removeAttribute(
      "src"
    );

    return;
  }


  imagePreview.src =
    url;

  imagePreview.style.display =
    "block";
}


/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct(event){

  event.preventDefault();


  const name =
    productName.value.trim();


  if(!name){

    showToast(
      "กรุณาใส่ชื่อสินค้า",
      "error"
    );

    productName.focus();

    return;
  }


  const retail =
    retailPrice.value === ""
      ? null
      : Number(retailPrice.value);


  const distributor =
    distributorPrice.value === ""
      ? null
      : Number(distributorPrice.value);


  if(
    retail !== null &&
    (
      Number.isNaN(retail) ||
      retail < 0
    )
  ){

    showToast(
      "ราคาปกติไม่ถูกต้อง",
      "error"
    );

    return;
  }


  if(
    distributor !== null &&
    (
      Number.isNaN(distributor) ||
      distributor < 0
    )
  ){

    showToast(
      "ราคาตัวแทนไม่ถูกต้อง",
      "error"
    );

    return;
  }


  const order =
    Number.parseInt(
      sortOrder.value,
      10
    );


  const payload = {

    name,

    category:
      productCategory.value.trim() ||
      null,

    description:
      productDescription.value.trim() ||
      null,

    image_url:
      productImage.value.trim() ||
      null,

    retail_price:
      retail,

    distributor_price:
      distributor,

    status:
      productStatus.value,

    sort_order:
      Number.isNaN(order)
        ? 0
        : order

  };


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "กำลังบันทึก...";


  let result;


  if(editingId){

    result =
      await supabaseClient
        .from("products")
        .update(payload)
        .eq(
          "id",
          editingId
        );

  }
  else{

    result =
      await supabaseClient
        .from("products")
        .insert(
          payload
        );

  }


  saveBtn.disabled =
    false;

  saveBtn.textContent =
    "บันทึกสินค้า";


  if(result.error){

    console.error(result.error);

    showToast(
      "บันทึกไม่สำเร็จ: " +
      result.error.message,
      "error"
    );

    return;
  }


  closeProductModal();


  showToast(
    editingId
      ? "แก้ไขสินค้าเรียบร้อยแล้ว"
      : "เพิ่มสินค้าเรียบร้อยแล้ว",
    "success"
  );


  await loadProducts();
}


/* =========================================================
   CHANGE STATUS
========================================================= */

async function changeStatus(
  id,
  status
){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product){
    return;
  }


  const label =
    statusLabel(status);


  const confirmed =
    confirm(
      `ต้องการเปลี่ยน "${product.name}" เป็น "${label}" ใช่หรือไม่?`
    );


  if(!confirmed){
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .update({
        status
      })
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    showToast(
      "เปลี่ยนสถานะไม่สำเร็จ: " +
      error.message,
      "error"
    );

    return;
  }


  showToast(
    "เปลี่ยนสถานะเรียบร้อยแล้ว",
    "success"
  );


  await loadProducts();
}


/* =========================================================
   EVENTS
========================================================= */

document
  .getElementById("addProductBtn")
  .addEventListener(
    "click",
    openAdd
  );


document
  .getElementById("closeModalBtn")
  .addEventListener(
    "click",
    closeProductModal
  );


document
  .getElementById("cancelBtn")
  .addEventListener(
    "click",
    closeProductModal
  );


productModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      productModal
    ){

      closeProductModal();

    }

  }
);


productForm.addEventListener(
  "submit",
  saveProduct
);


productImage.addEventListener(
  "input",
  updateImagePreview
);


searchInput.addEventListener(
  "input",
  applyFilters
);


statusFilter.addEventListener(
  "change",
  applyFilters
);


document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();

      window.location.href =
        "admin-login.html";

    }
  );


/* =========================================================
   START
========================================================= */

(async function(){

  const isAdmin =
    await checkAdmin();

  if(!isAdmin){
    return;
  }

  await loadProducts();

})();

</script>
