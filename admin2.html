<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bennie Choco Admin — ตัวแทน</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Niramit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#A0C4FF;
  --blue-soft:#EAF3FF;
  --mint:#CAFFBF;
  --yellow:#FDFFB6;
  --cream:#FFFDF5;
  --white:#ffffff;
  --text:#3D405B;
  --muted:#7B819A;
  --line:#E8EDF5;

  --green:#62B978;
  --green-bg:#EAF8ED;

  --orange:#E9A23B;
  --orange-bg:#FFF4DF;

  --red:#D96B6B;
  --red-bg:#FFF0F0;

  --purple:#8D78D8;
  --purple-bg:#F1EDFF;

  --shadow:0 14px 35px rgba(61,64,91,.09);
  --shadow-soft:0 8px 22px rgba(61,64,91,.07);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:'Niramit',sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,rgba(160,196,255,.38),transparent 25%),
    radial-gradient(circle at 90% 15%,rgba(202,255,191,.32),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(253,255,182,.25),transparent 30%),
    var(--cream);
  min-height:100vh;
  overflow-x:hidden;
}

/* clouds */
.cloud{
  position:fixed;
  border-radius:999px;
  background:rgba(255,255,255,.78);
  filter:blur(.2px);
  z-index:-2;
  pointer-events:none;
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud::before{
  width:55%;
  height:140%;
  left:12%;
  bottom:0;
}

.cloud::after{
  width:48%;
  height:125%;
  right:10%;
  bottom:0;
}

.cloud-1{
  width:190px;
  height:55px;
  top:100px;
  left:-45px;
}

.cloud-2{
  width:220px;
  height:62px;
  top:280px;
  right:-65px;
}

.cloud-3{
  width:150px;
  height:45px;
  bottom:100px;
  left:-35px;
}

.floating{
  position:fixed;
  width:75px;
  height:75px;
  object-fit:contain;
  opacity:.75;
  z-index:-1;
  pointer-events:none;
  animation:float 5s ease-in-out infinite;
}

.float-1{
  top:120px;
  right:4%;
}

.float-2{
  bottom:100px;
  left:3%;
  animation-delay:1.4s;
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }
  50%{
    transform:translateY(-10px) rotate(2deg);
  }
}

/* topbar */
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.8);
}

.topbar-inner{
  width:min(1180px,calc(100% - 28px));
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.brand-icon{
  width:48px;
  height:48px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#fff,var(--blue-soft));
  border:1px solid rgba(160,196,255,.5);
  box-shadow:var(--shadow-soft);
  font-size:25px;
  flex:none;
}

.brand-text{
  min-width:0;
}

.brand-title{
  font-weight:700;
  font-size:19px;
  line-height:1.15;
}

.brand-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.top-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.top-btn{
  border:1px solid var(--line);
  background:white;
  color:var(--text);
  text-decoration:none;
  padding:9px 13px;
  border-radius:12px;
  font-family:inherit;
  font-size:13px;
  cursor:pointer;
  transition:.2s;
}

.top-btn:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-soft);
}

.top-btn.primary{
  background:var(--blue);
  border-color:var(--blue);
}

/* layout */
.container{
  width:min(1180px,calc(100% - 28px));
  margin:0 auto;
  padding:30px 0 70px;
}

.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}

.page-kicker{
  font-size:13px;
  color:#7290C0;
  font-weight:600;
  margin-bottom:3px;
}

.page-title{
  margin:0;
  font-size:32px;
  line-height:1.15;
  font-weight:700;
}

.page-desc{
  margin:7px 0 0;
  color:var(--muted);
  font-size:14px;
}

.refresh-btn{
  border:1px solid var(--line);
  background:white;
  color:var(--text);
  padding:11px 15px;
  border-radius:13px;
  font-family:inherit;
  cursor:pointer;
  box-shadow:var(--shadow-soft);
  white-space:nowrap;
}

.refresh-btn:active{
  transform:scale(.98);
}

/* stats */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.9);
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow-soft);
  position:relative;
  overflow:hidden;
}

.stat::after{
  content:"";
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  right:-25px;
  top:-28px;
  background:rgba(255,255,255,.55);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-number{
  margin-top:5px;
  font-size:30px;
  font-weight:700;
}

.stat.pending{
  background:linear-gradient(135deg,#fff,#FFF8E8);
}

.stat.active{
  background:linear-gradient(135deg,#fff,#EFFBF1);
}

.stat.rejected{
  background:linear-gradient(135deg,#fff,#FFF2F2);
}

.stat.suspended{
  background:linear-gradient(135deg,#fff,#F3F0FF);
}

/* filters */
.filter-box{
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.95);
  border-radius:20px;
  padding:16px;
  box-shadow:var(--shadow-soft);
  margin-bottom:20px;
}

.filters{
  display:grid;
  grid-template-columns:minmax(220px,1fr) 190px auto;
  gap:10px;
}

.input,
.select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:13px;
  padding:12px 14px;
  outline:none;
  font-family:inherit;
  font-size:14px;
  transition:.2s;
}

.input:focus,
.select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(160,196,255,.18);
}

.filter-count{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 15px;
  border-radius:13px;
  background:var(--blue-soft);
  color:#5777A8;
  font-size:13px;
  white-space:nowrap;
}

/* list */
.list-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 2px 10px;
}

.list-title{
  font-size:17px;
  font-weight:700;
}

.list-note{
  color:var(--muted);
  font-size:12px;
}

.cards{
  display:grid;
  gap:12px;
}

.agent-card{
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  box-shadow:var(--shadow-soft);
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:16px;
  transition:.2s;
}

.agent-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.agent-main{
  min-width:0;
}

.agent-top{
  display:flex;
  align-items:flex-start;
  gap:12px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,var(--blue-soft),#fff);
  border:1px solid #DCE9FF;
  font-size:22px;
  flex:none;
}

.agent-info{
  min-width:0;
}

.agent-name{
  font-weight:700;
  font-size:17px;
  word-break:break-word;
}

.agent-email{
  color:var(--muted);
  font-size:12px;
  word-break:break-all;
  margin-top:1px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:11px;
}

.meta-chip{
  border:1px solid var(--line);
  background:#FAFBFD;
  border-radius:9px;
  padding:5px 9px;
  font-size:11px;
  color:#68708A;
}

.meta-chip strong{
  color:var(--text);
  font-weight:600;
}

.agent-side{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  min-width:145px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
}

.status::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:currentColor;
}

.status.pending{
  color:#B67A16;
  background:var(--orange-bg);
}

.status.active{
  color:#41965A;
  background:var(--green-bg);
}

.status.rejected{
  color:#C25454;
  background:var(--red-bg);
}

.status.suspended{
  color:#7460BD;
  background:var(--purple-bg);
}

.card-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:7px;
}

.action-btn{
  border:1px solid var(--line);
  background:white;
  color:var(--text);
  border-radius:10px;
  padding:8px 10px;
  font-family:inherit;
  font-size:11px;
  cursor:pointer;
  transition:.2s;
}

.action-btn:hover{
  transform:translateY(-1px);
}

.action-btn.approve{
  background:var(--green-bg);
  color:#398A50;
  border-color:#D0EED6;
}

.action-btn.reject{
  background:var(--red-bg);
  color:#BD5050;
  border-color:#F2D4D4;
}

.action-btn.suspend{
  background:var(--purple-bg);
  color:#705CB8;
  border-color:#DED8F8;
}

.action-btn.view{
  background:var(--blue-soft);
  color:#5877A8;
  border-color:#DCE9FF;
}

/* empty */
.empty{
  text-align:center;
  background:rgba(255,255,255,.9);
  border:1px dashed #DCE3EE;
  border-radius:20px;
  padding:50px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:7px;
}

/* loading */
.loading{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #E5ECF6;
  border-top-color:var(--blue);
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* modal */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(61,64,91,.35);
  backdrop-filter:blur(5px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(540px,100%);
  max-height:min(90vh,760px);
  overflow:auto;
  background:#fff;
  border-radius:24px;
  box-shadow:0 30px 80px rgba(61,64,91,.25);
  padding:22px;
  animation:modalIn .2s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:17px;
}

.modal-title{
  margin:0;
  font-size:20px;
  font-weight:700;
}

.modal-close{
  width:36px;
  height:36px;
  border:0;
  border-radius:11px;
  background:#F5F7FA;
  color:var(--text);
  cursor:pointer;
  font-size:18px;
}

.detail-grid{
  display:grid;
  gap:10px;
}

.detail{
  background:#FAFBFD;
  border:1px solid #EEF1F5;
  border-radius:13px;
  padding:11px 13px;
}

.detail-label{
  color:var(--muted);
  font-size:11px;
}

.detail-value{
  margin-top:2px;
  font-size:14px;
  word-break:break-word;
}

.modal-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:17px;
}

.modal-actions button{
  flex:1;
  min-width:120px;
}

/* toast */
.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  background:#3D405B;
  color:white;
  padding:12px 17px;
  border-radius:13px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  z-index:200;
  transition:.25s;
  box-shadow:var(--shadow);
  max-width:calc(100% - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.toast.success{
  background:#4E9A61;
}

.toast.error{
  background:#C85B5B;
}

/* confirm */
.confirm-text{
  color:#68708A;
  font-size:14px;
  line-height:1.7;
}

.confirm-highlight{
  margin:13px 0;
  padding:13px;
  border-radius:13px;
  background:var(--blue-soft);
  color:#5877A8;
  font-weight:600;
}

.confirm-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.confirm-actions button{
  flex:1;
}

/* responsive */
@media(max-width:900px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .filters{
    grid-template-columns:1fr 180px;
  }

  .filter-count{
    min-height:44px;
  }
}

@media(max-width:650px){
  .topbar-inner{
    min-height:68px;
  }

  .brand-icon{
    width:42px;
    height:42px;
    border-radius:14px;
  }

  .brand-title{
    font-size:16px;
  }

  .brand-sub{
    font-size:10px;
  }

  .top-btn{
    padding:8px 10px;
    font-size:11px;
  }

  .container{
    width:min(100% - 20px,1180px);
    padding-top:22px;
  }

  .page-head{
    align-items:flex-start;
    flex-direction:column;
    gap:12px;
  }

  .page-title{
    font-size:27px;
  }

  .refresh-btn{
    width:100%;
  }

  .stats{
    gap:9px;
  }

  .stat{
    padding:14px;
    border-radius:17px;
  }

  .stat-number{
    font-size:25px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .filter-count{
    min-height:42px;
  }

  .agent-card{
    grid-template-columns:1fr;
  }

  .agent-side{
    align-items:flex-start;
    min-width:0;
  }

  .card-actions{
    justify-content:flex-start;
    width:100%;
  }

  .action-btn{
    flex:1;
    min-width:90px;
  }

  .floating{
    width:58px;
    height:58px;
  }
}
</style>
</head>

<body>

<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>

<img
  class="floating float-1"
  src="https://i.postimg.cc/J7DGzDk1/IMG-8482.png"
  alt=""
>

<img
  class="floating float-2"
  src="https://i.postimg.cc/J7DGzDk1/IMG-8482.png"
  alt=""
>

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <div class="brand-icon">☁️</div>

      <div class="brand-text">
        <div class="brand-title">Bennie Choco Admin</div>
        <div class="brand-sub">จัดการตัวแทน</div>
      </div>
    </div>

    <div class="top-actions">
      <a class="top-btn" href="admin.html">
        ← หน้าหลัก
      </a>

      <button class="top-btn" id="logoutBtn">
        ออกจากระบบ
      </button>
    </div>

  </div>
</header>

<main class="container">

  <section class="page-head">

    <div>
      <div class="page-kicker">DISTRIBUTOR MANAGEMENT</div>

      <h1 class="page-title">
        จัดการตัวแทน
      </h1>

      <p class="page-desc">
        ตรวจสอบคำขอสมัครและจัดการสถานะตัวแทนในระบบ
      </p>
    </div>

    <button class="refresh-btn" id="refreshBtn">
      ↻ รีเฟรชข้อมูล
    </button>

  </section>


  <!-- STATS -->

  <section class="stats">

    <div class="stat pending">
      <div class="stat-label">รอตรวจสอบ</div>
      <div class="stat-number" id="pendingCount">0</div>
    </div>

    <div class="stat active">
      <div class="stat-label">ใช้งานอยู่</div>
      <div class="stat-number" id="activeCount">0</div>
    </div>

    <div class="stat rejected">
      <div class="stat-label">ปฏิเสธ</div>
      <div class="stat-number" id="rejectedCount">0</div>
    </div>

    <div class="stat suspended">
      <div class="stat-label">ระงับ</div>
      <div class="stat-number" id="suspendedCount">0</div>
    </div>

  </section>


  <!-- FILTER -->

  <section class="filter-box">

    <div class="filters">

      <input
        type="search"
        class="input"
        id="searchInput"
        placeholder="ค้นหาชื่อ / อีเมล / รหัสตัวแทน / เลขคำขอ..."
      >

      <select class="select" id="statusFilter">

        <option value="all">
          ทุกสถานะ
        </option>

        <option value="pending">
          รอตรวจสอบ
        </option>

        <option value="active">
          ใช้งานอยู่
        </option>

        <option value="rejected">
          ปฏิเสธ
        </option>

        <option value="suspended">
          ระงับ
        </option>

      </select>

      <div class="filter-count" id="filterCount">
        0 รายการ
      </div>

    </div>

  </section>


  <!-- LIST -->

  <div class="list-head">

    <div class="list-title">
      รายการตัวแทน
    </div>

    <div class="list-note" id="lastUpdated">
      —
    </div>

  </div>

  <section id="agentList" class="cards">

    <div class="loading">
      <div class="spinner"></div>
      กำลังโหลดข้อมูล...
    </div>

  </section>

</main>


<!-- DETAIL MODAL -->

<div class="modal-backdrop" id="detailModal">

  <div class="modal">

    <div class="modal-head">

      <div>
        <h2 class="modal-title">
          รายละเอียดตัวแทน
        </h2>
      </div>

      <button
        class="modal-close"
        data-close="detailModal"
      >
        ×
      </button>

    </div>

    <div id="detailContent"></div>

  </div>

</div>


<!-- CONFIRM MODAL -->

<div class="modal-backdrop" id="confirmModal">

  <div class="modal">

    <div class="modal-head">

      <h2 class="modal-title">
        ยืนยันการเปลี่ยนสถานะ
      </h2>

      <button
        class="modal-close"
        data-close="confirmModal"
      >
        ×
      </button>

    </div>

    <div class="confirm-text">
      คุณกำลังจะเปลี่ยนสถานะของตัวแทนเป็น
    </div>

    <div class="confirm-highlight" id="confirmHighlight">
      —
    </div>

    <div class="confirm-text" id="confirmDescription">
      —
    </div>

    <div class="confirm-actions">

      <button
        class="action-btn"
        id="cancelConfirmBtn"
      >
        ยกเลิก
      </button>

      <button
        class="action-btn approve"
        id="confirmActionBtn"
      >
        ยืนยัน
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatDate(value){

  if(!value){
    return "—";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "—";
  }

  return date.toLocaleString(
    "th-TH",
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function statusLabel(status){

  const labels = {
    pending:"รอตรวจสอบ",
    active:"ใช้งานอยู่",
    rejected:"ปฏิเสธ",
    suspended:"ระงับ"
  };

  return labels[status] || status || "—";
}


function statusClass(status){

  if(
    ["pending","active","rejected","suspended"]
      .includes(status)
  ){
    return status;
  }

  return "pending";
}


function getInitial(name){

  if(!name){
    return "♡";
  }

  return String(name)
    .trim()
    .charAt(0)
    .toUpperCase();
}


function showToast(
  message,
  type = ""
){

  toast.textContent =
    message;

  toast.className =
    "toast show " + type;

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(() => {

      toast.className =
        "toast";

    },3000);
}

async function checkAdmin(){

  if(!session){

  }


  const {

  } =

  if(error){

    console.error(error);

    showToast(
      "ไม่สามารถตรวจสอบสิทธิ์แอดมินได้",
      "error"
    );

    await supabaseClient
      .auth

    setTimeout(() => {

    },1000);

    return false;
  }


  if(!data){

    showToast(
      "บัญชีนี้ไม่มีสิทธิ์แอดมิน",

    await supabaseClient

/* =========================================================
   LOAD AGENTS
========================================================= */

async function loadAgents(){

  agentList.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      กำลังโหลดข้อมูล...
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        email,
        nickname,
        distributor_code,
        status,
        request_no,
        approved_at,
        approved_by,
        created_at,
        updated_at
      `)
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    agentList.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <div>
          ไม่สามารถโหลดข้อมูลตัวแทนได้
        </div>

        <div style="font-size:12px;margin-top:5px;">
          ${escapeHtml(error.message)}
        </div>

      </div>
    `;

    showToast(
      "โหลดข้อมูลไม่สำเร็จ",
      "error"
    );

    return;
  }


  allAgents =
    data || [];


  updateStats();

  applyFilters();


  lastUpdated.textContent =
    "อัปเดต " +
    new Date()
      .toLocaleTimeString(
        "th-TH",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  const counts = {
    pending:0,
    active:0,
    rejected:0,
    suspended:0
  };


  allAgents.forEach(agent => {

    if(
      Object.prototype.hasOwnProperty
        .call(
          counts,
          agent.status
        )
    ){

      counts[agent.status]++;

    }

  });


  pendingCount.textContent =
    counts.pending;

  activeCount.textContent =
    counts.active;

  rejectedCount.textContent =
    counts.rejected;

  suspendedCount.textContent =
    counts.suspended;
}


/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();

  const status =
    statusFilter.value;


  const filtered =
    allAgents.filter(agent => {

      const text = [

        agent.nickname,
        agent.email,
        agent.distributor_code,
        agent.request_no

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      const keywordMatch =
        !keyword ||
        text.includes(keyword);


      const statusMatch =
        status === "all" ||
        agent.status === status;


      return (
        keywordMatch &&
        statusMatch
      );

    });


  renderAgents(filtered);
}


/* =========================================================
   RENDER
========================================================= */

function renderAgents(agents){

  filterCount.textContent =
    `${agents.length} รายการ`;


  if(!agents.length){

    agentList.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          ☁️
        </div>

        <div>
          ไม่พบตัวแทน
        </div>

        <div style="font-size:12px;margin-top:5px;">
          ลองเปลี่ยนคำค้นหาหรือสถานะที่เลือก
        </div>

      </div>
    `;

    return;
  }


  agentList.innerHTML =
    agents
      .map(renderAgent)
      .join("");
}

          </div>

/* =========================================================
   CONFIRM STATUS
========================================================= */

function openConfirm(
  id,
  newStatus
){

  const agent =
    allAgents.find(
      item => item.id === id
    );


  if(!agent){
    return;
  }


  currentConfirmId =
    id;

  currentConfirmStatus =
    newStatus;


  const actionText = {

    active:"ใช้งานอยู่",
    rejected:"ปฏิเสธ",
    suspended:"ระงับ"

  };


  const statusText =
    actionText[newStatus] ||
    newStatus;


  confirmHighlight.textContent =
    `${agent.nickname || "ตัวแทน"} → ${statusText}`;


  if(newStatus === "active"){

    confirmDescription.textContent =
      "เมื่อตั้งเป็นใช้งานอยู่ ตัวแทนจะสามารถเข้าสู่ Distributor Portal ได้ตามสิทธิ์ของบัญชี";

    confirmActionBtn.className =
      "action-btn approve";

  }


  if(newStatus === "rejected"){

    confirmDescription.textContent =
      "คำขอนี้จะถูกเปลี่ยนเป็นปฏิเสธ และตัวแทนจะไม่สามารถใช้งานระบบในสถานะนี้ได้";

    confirmActionBtn.className =
      "action-btn reject";

  }


  if(newStatus === "suspended"){

    confirmDescription.textContent =
      "ตัวแทนจะถูกระงับการใช้งานจนกว่าจะเปลี่ยนสถานะกลับเป็นใช้งานอยู่";

    confirmActionBtn.className =
      "action-btn suspend";

  }


  confirmActionBtn.textContent =
    "ยืนยัน";


  confirmModal.classList.add("show");
}


function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");
}


/* =========================================================
   UPDATE STATUS
========================================================= */

async function updateStatus(){

  if(
    !currentConfirmId ||
    !currentConfirmStatus
  ){
    return;
  }


  confirmActionBtn.disabled =
    true;

  confirmActionBtn.textContent =
    "กำลังบันทึก...";


  const updateData = {

    status:
      currentConfirmStatus

  };


  if(
    currentConfirmStatus === "active"
  ){

    updateData.approved_at =
      new Date().toISOString();

    const {
      data:{
        user
      }
    } =
      await supabaseClient
        .auth
        .getUser();


    updateData.approved_by =
      user?.id || null;

  }


  if(
    currentConfirmStatus === "rejected" ||
    currentConfirmStatus === "suspended"
  ){

    /*
      ไม่ลบ approved_at / approved_by
      เพื่อเก็บประวัติการอนุมัติเดิมไว้
    */

  }


  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .update(updateData)
      .eq(
        "id",
        currentConfirmId
      );


  confirmActionBtn.disabled =
    false;

  confirmActionBtn.textContent =
    "ยืนยัน";


  if(error){

    console.error(error);

    showToast(
      "เปลี่ยนสถานะไม่สำเร็จ: " +
      error.message,
      "error"
    );

    return;
  }


  closeModal(
    "confirmModal"
  );


  showToast(
    "เปลี่ยนสถานะเรียบร้อยแล้ว",
    "success"
  );


  currentConfirmId =
    null;

  currentConfirmStatus =
    null;


  await loadAgents();
}
